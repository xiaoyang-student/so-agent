[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so-agent"
version = "0.1.0"
description = "多 Agent 编排框架：主 Agent 驱动任务分解、动态子 Agent、评审与人机升级"
requires-python = ">=3.10"
dependencies = [
    "openai-agents>=0.22.0,<0.23",
    "openai>=3.0.0,<4",
    "pydantic>=2.12.2,<3",
    "pydantic-settings>=2.0",
    "json-repair>=0.30",
    "pyyaml",
    "python-statemachine>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# api_config.yaml：运行时由 config_loader 从包目录加载（顶层供路由分类、
# 三个工具包各一份供对应 Agent 使用）；prompt.md：三个固定 Agent 的
# 系统提示词，agent.py 以包目录相对路径读取，必须随包分发。
so_agent = [
    "api_config.yaml",
    "tool_packages/*/api_config.yaml",
    "tool_packages/*/prompt.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
