<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SO-Agent 控制台：提交任务，查看任务分解路线、子任务执行状态、时间线与产物。">
<meta name="theme-color" content="oklch(17% 0.008 250)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f6b83d'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='600' fill='%231c1407' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<title>SO-Agent 控制台</title>
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: Console (dealt, paper) · redesign: full
 * nav: kept console bar, wordmark, health reading, three ghost controls · footer: one quiet line under the shell
 * signature: the run route drawn from the task's own nodes · states: running, queued, completed, failed, cancelled, human_required, scheduled, paused
 * console: graphite · axes: dark/graphite/grotesk-sans/chromatic-amber · posture: restrained · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · weakest: V, a console in this category always keeps a rail; the route canvas is set as the lead surface and the rail is one column of hairline panels, not a card stack */

  @font-face {
    font-family: "Host Grotesk";
    src: url("static/fonts/host-grotesk-400.woff2") format("woff2");
    font-weight: 400 600;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Atkinson Hyperlegible Mono";
    src: url("static/fonts/atkinson-mono-400.woff2") format("woff2");
    font-weight: 400 500;
    font-style: normal;
    font-display: swap;
  }

  :root {
    color-scheme: dark;
    --color-paper: oklch(17% 0.008 250);
    --color-paper-2: oklch(21% 0.009 250);
    --color-paper-3: oklch(13.5% 0.007 250);
    --color-ink: oklch(95% 0.005 250);
    --color-ink-2: oklch(83% 0.008 250);
    --color-muted: oklch(71% 0.01 250);
    --color-rule: oklch(31% 0.01 250);
    --color-rule-2: oklch(42% 0.012 250);
    --color-field: oklch(58% 0.012 250);
    --color-accent: oklch(82% 0.15 80);
    --color-accent-ink: oklch(18% 0.04 75);
    --color-accent-soft: oklch(29% 0.05 80);
    --color-cool: oklch(77% 0.12 245);
    --color-cool-soft: oklch(29% 0.05 245);
    --color-ok: oklch(76% 0.15 150);
    --color-ok-soft: oklch(24.5% 0.03 150);
    --color-bad: oklch(70% 0.17 25);
    --color-bad-soft: oklch(24.5% 0.035 25);
    --color-focus: oklch(82% 0.15 80);
    --color-scrim: oklch(8% 0.005 250 / 0.72);
    --font-display: "Host Grotesk", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --font-body: var(--font-display);
    --font-outlier: "Atkinson Hyperlegible Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --mono: var(--font-outlier);
    --faint: var(--color-muted);
    --danger: var(--color-bad);
    --space-3xs: 2px;
    --space-2xs: 4px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 16px;
    --space-lg: 24px;
    --space-xl: 40px;
    --space-2xl: 64px;
    --text-xs: 0.75rem;
    --text-sm: 0.8125rem;
    --text-md: 0.875rem;
    --text-lg: 1rem;
    --text-xl: 1.125rem;
    --text-2xl: 1.375rem;
    --text-3xl: 1.75rem;
    --radius-card: 10px;
    --radius-pill: 6px;
    --radius-chip: 4px;
    --rule-hair: 1px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-micro: 120ms;
    --dur-short: 220ms;
    --container: 1520px;
    --z-modal: 400;
    --z-toast: 500;
  }

  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  html { height: 100%; scrollbar-color: var(--color-rule-2) var(--color-paper); }
  body {
    margin: 0;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-md);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    caret-color: var(--color-accent);
  }
  ::selection { background: color-mix(in oklab, var(--color-accent) 22%, transparent); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; transition: none; }
  button, textarea, input, select { font: inherit; color: inherit; }
  a { color: var(--color-cool); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
  a:hover { color: var(--color-accent); }
  h1, h2, h3, h4 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
    min-width: 0;
    text-wrap: balance;
  }
  p { margin: 0; text-wrap: pretty; }
  .app { max-width: var(--container); margin: 0 auto; padding: var(--space-lg) 32px var(--space-xl); }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: var(--space-md);
    padding: var(--space-sm) var(--space-md);
    background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule-2);
    border-radius: var(--radius-card);
  }
  .brand { display: flex; align-items: center; gap: var(--space-sm); }
  .brand-mark {
    width: 36px; height: 36px; border-radius: var(--radius-pill); display: grid; place-items: center;
    background: var(--color-accent); color: var(--color-accent-ink);
    font-weight: 500; font-size: var(--text-lg);
  }
  .brand h1 { font-size: var(--text-lg); font-weight: 600; }
  .brand p { margin-top: var(--space-3xs); font-size: var(--text-xs); color: var(--color-muted); }
  .topbar .spacer { flex: 1; }
  .health {
    display: inline-flex; align-items: center; gap: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted);
    padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-chip);
    background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule-2);
    white-space: nowrap;
  }
  .health .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-muted); }
  .health.ok .dot { background: var(--color-ok); }
  .health.off .dot { background: var(--color-bad); }
  .btn {
    appearance: none; border: var(--rule-hair) solid var(--color-rule-2); background: var(--color-paper-2); color: var(--color-ink);
    border-radius: var(--radius-pill); padding: var(--space-xs) var(--space-sm); cursor: pointer;
    font-weight: 500;
    transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
    display: inline-flex; align-items: center; gap: var(--space-2xs); white-space: nowrap;
  }
  .btn:hover { background: var(--color-paper-3); border-color: var(--color-ink-2); }
  .btn:active { background: var(--color-paper-3); border-color: var(--color-ink); }
  .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
  .btn.primary:hover { background: color-mix(in oklab, var(--color-accent) 84%, var(--color-ink)); border-color: var(--color-ink); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--color-muted); }
  .btn.ghost:hover { background: var(--color-paper-3); color: var(--color-ink); }
  .btn.small { padding: var(--space-2xs) var(--space-xs); font-size: var(--text-xs); border-radius: var(--radius-chip); }
  .btn.danger { color: var(--color-bad); border-color: var(--color-bad); background: var(--color-paper-2); }
  .btn.danger:hover { background: var(--color-bad-soft); border-color: var(--color-bad); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- 主布局 ---------- */
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--space-lg); margin-top: var(--space-lg); align-items: start; }
  .panel { background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); color: var(--color-ink); }
  .panel + .panel { margin-top: var(--space-md); }
  .panel-head { padding: var(--space-md) var(--space-md) 0; display: flex; align-items: center; gap: var(--space-xs); }
  .panel-head h2 { font-size: var(--text-md); font-weight: 600; }
  .panel-head .count { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; font-size: var(--text-xs); color: var(--color-muted); }
  .panel-body { padding: var(--space-sm) var(--space-md) var(--space-md); }

  /* ---------- 提问表单 ---------- */
  .ask textarea {
    width: 100%; min-height: 112px; resize: vertical; padding: var(--space-sm);
    border-radius: var(--radius-pill);
    border: var(--rule-hair) solid var(--color-field); background: var(--color-paper-3);
    line-height: 1.55;
  }
  .ask textarea::placeholder, .gfield textarea::placeholder { color: var(--color-muted); }
  .ask .row { display: flex; gap: var(--space-xs); margin-top: var(--space-sm); align-items: center; }
  .ask .row .hint { flex: 1; font-size: var(--text-xs); color: var(--color-muted); }
  .ask .advanced { margin-top: var(--space-sm); border-top: var(--rule-hair) solid var(--color-rule); padding-top: var(--space-sm); }
  .ask .advanced summary { cursor: pointer; font-size: var(--text-xs); color: var(--color-muted); list-style: none; display: flex; align-items: center; gap: var(--space-2xs); }
  .ask .advanced summary::-webkit-details-marker { display: none; }
  .ask .advanced summary::before { content: "＋"; font-size: var(--text-xs); color: var(--color-muted); }
  .ask .advanced[open] summary::before { content: "－"; }
  .ask .field { margin-top: var(--space-sm); }
  .ask .field label { display: block; font-size: var(--text-xs); color: var(--color-muted); margin-bottom: var(--space-2xs); }
  .ask .field textarea { min-height: 64px; font-size: var(--text-sm); }
  .ask .error { margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--color-bad); display: none; }
  .ask .error.show { display: block; }

  /* ---------- 任务列表 ---------- */
  .task-list { margin-top: var(--space-2xs); max-height: 430px; overflow: auto; padding-right: var(--space-2xs); }
  .task-item {
    position: relative; padding: var(--space-sm); border-radius: var(--radius-pill); cursor: pointer;
    border: var(--rule-hair) solid transparent;
    transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out);
    margin-bottom: var(--space-2xs);
  }
  .task-item::before {
    content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 2px; border-radius: 1px;
    background: transparent;
  }
  .task-item:hover { background: var(--color-paper-3); }
  .task-item.active { background: var(--color-accent-soft); border-color: var(--color-accent); }
  .task-item.active::before { background: var(--color-accent); }
  .task-item .line1 { display: flex; align-items: center; gap: var(--space-xs); }
  .task-item .title { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .task-item .meta { margin-top: var(--space-2xs); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2xs) var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
  .task-item .meta > span { white-space: nowrap; }
  .task-item .meta > .tag { flex: none; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--color-muted); }
  .status-dot.running { background: var(--color-cool); animation: pulse 1.6s ease-in-out infinite; }
  .status-dot.queued { background: var(--color-muted); }
  .status-dot.completed { background: var(--color-ok); }
  .status-dot.failed { background: var(--color-bad); }
  .status-dot.cancelled { background: var(--color-muted); }
  .status-dot.human_required { background: var(--color-accent); }
  .status-dot.scheduled { background: var(--color-cool); }
  .status-dot.paused { background: var(--color-accent); }
  .sched-runs {
    margin-top: var(--space-xs); padding-top: var(--space-xs);
    border-top: var(--rule-hair) solid var(--color-rule);
    font-size: var(--text-xs); color: var(--color-muted);
  }
  .sched-run { display: flex; gap: var(--space-xs); padding: var(--space-3xs) 0; align-items: baseline; }
  .sched-run .run-status { font-weight: 500; flex: none; min-width: 56px; }
  .sched-run .run-detail { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sched-empty { color: var(--color-muted); padding: var(--space-2xs) 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .empty-inline { padding: var(--space-lg) var(--space-xs); text-align: center; color: var(--color-muted); font-size: var(--text-xs); }

  /* ---------- 工作区 ---------- */
  .workspace { min-height: 640px; }
  .empty-state { padding: var(--space-2xl) var(--space-lg); text-align: left; max-width: 520px; }
  .empty-state h3 { margin-bottom: var(--space-xs); font-size: var(--text-2xl); font-weight: 500; letter-spacing: -0.02em; }
  .empty-state p { color: var(--color-muted); font-size: var(--text-md); max-width: 46ch; }
  .kbd {
    font-family: var(--font-outlier); font-size: var(--text-xs);
    border: var(--rule-hair) solid var(--color-rule-2); border-bottom-width: 2px;
    border-radius: var(--radius-chip); padding: 0 var(--space-2xs); background: var(--color-paper-2); color: var(--color-ink-2);
  }

  .task-head { padding: var(--space-md); display: flex; gap: var(--space-md); align-items: flex-start; border-bottom: var(--rule-hair) solid var(--color-rule); }
  .task-head .main { flex: 1; min-width: 0; }
  .task-head h2 { margin-bottom: var(--space-2xs); font-size: var(--text-xl); font-weight: 500; line-height: 1.4; }
  .task-head .sub { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); align-items: center; }
  .task-head .actions { display: flex; gap: var(--space-xs); flex: none; }
  .tag {
    display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-3xs) var(--space-xs);
    border-radius: var(--radius-chip);
    font-size: var(--text-xs); font-weight: 500; background: var(--color-paper-2); color: var(--color-ink-2);
    border: var(--rule-hair) solid var(--color-rule);
  }
  .tag.blue { background: var(--color-cool-soft); color: var(--color-ink); border-color: var(--color-cool); }
  .tag.green { background: var(--color-ok-soft); color: var(--color-ink); border-color: var(--color-ok); }
  .tag.red { background: var(--color-bad-soft); color: var(--color-ink); border-color: var(--color-bad); }
  .tag.amber { background: var(--color-accent-soft); color: var(--color-ink); border-color: var(--color-accent); }
  .tag.teal { background: var(--color-cool-soft); color: var(--color-ink); border-color: var(--color-cool); }
  .tag.mono { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
  .section { padding: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
  .section:last-child { border-bottom: none; }
  .section-head { display: flex; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-sm); }
  .section-head h3 { font-size: var(--text-md); font-weight: 600; }
  .section-head .sub { font-size: var(--text-xs); color: var(--color-muted); }
  .section-head .spacer { flex: 1; }

  /* 阶段条 */
  .stagebar { display: flex; align-items: center; gap: 0; overflow: auto; padding: var(--space-3xs) 0; }
  .stage { display: flex; align-items: center; gap: var(--space-xs); flex: none; }
  .stage .bubble {
    width: 24px; height: 24px; border-radius: var(--radius-chip); display: grid; place-items: center;
    font-family: var(--font-outlier); font-size: var(--text-xs);
    border: var(--rule-hair) solid var(--color-rule-2); color: var(--color-muted); background: var(--color-paper-2);
  }
  .stage .name { font-size: var(--text-xs); color: var(--color-muted); font-weight: 500; }
  .stage.done .bubble { background: var(--color-ok-soft); border-color: var(--color-ok); color: var(--color-ink); }
  .stage.done .name { color: var(--color-ink); }
  .stage.active .bubble { border-color: var(--color-accent); background: var(--color-accent-soft); color: var(--color-ink); }
  .stage.active .name { color: var(--color-ink); font-weight: 600; }
  .stage .connector { width: 32px; height: var(--rule-hair); background: var(--color-rule-2); margin: 0 var(--space-xs); }
  .stage.done .connector { background: var(--color-ok); }

  /* 结果 */
  .result {
    background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card);
    padding: var(--space-md); font-size: var(--text-md); line-height: 1.75; overflow-wrap: anywhere;
  }
  .result h2, .result h3, .result h4 { margin: var(--space-md) 0 var(--space-xs); line-height: 1.4; }
  .result h2 { font-size: var(--text-xl); } .result h3 { font-size: var(--text-lg); } .result h4 { font-size: var(--text-md); }
  .result p { margin: 0 0 var(--space-xs); }
  .result ul { margin: var(--space-2xs) 0 var(--space-sm); padding-left: var(--space-lg); }
  .result li { margin: var(--space-3xs) 0; }
  .result code {
    font-family: var(--font-outlier); font-size: var(--text-xs);
    background: var(--color-paper-3);
    border-radius: var(--radius-chip); padding: 0 var(--space-2xs);
  }
  .result pre.code { background: var(--color-paper-3); color: var(--color-ink); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); padding: var(--space-sm); overflow: auto; margin: var(--space-xs) 0; }
  .result pre.code code { background: none; border: none; color: inherit; padding: 0; font-size: var(--text-xs); }
  .result a { text-decoration: underline; text-underline-offset: 2px; }
  .placeholder-text { color: var(--color-muted); font-size: var(--text-xs); }
  .skeleton-line { height: 12px; border-radius: var(--radius-chip); background: linear-gradient(90deg, var(--color-paper-3) 25%, var(--color-paper-2) 50%, var(--color-paper-3) 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite; margin-bottom: var(--space-xs); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* 流程图 */
  .chart-tools { display: flex; align-items: center; gap: var(--space-xs); }
  .version-tabs { display: flex; gap: var(--space-2xs); flex-wrap: wrap; }
  .version-tab {
    border: var(--rule-hair) solid var(--color-rule-2); background: var(--color-paper-2); border-radius: var(--radius-chip);
    padding: var(--space-3xs) var(--space-xs);
    font-size: var(--text-xs); color: var(--color-muted); cursor: pointer;
    transition: background-color var(--dur-micro) var(--ease-out), border-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out);
  }
  .version-tab:hover { border-color: var(--color-ink-2); color: var(--color-ink); }
  .version-tab.active { background: var(--color-cool-soft); border-color: var(--color-cool); color: var(--color-ink); font-weight: 600; }
  .version-tab .badge { opacity: .7; margin-left: var(--space-3xs); font-size: var(--text-xs); }
  .chart-wrap {
    position: relative; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card);
    background-color: var(--color-paper-2);
    background-image: radial-gradient(circle at 1px 1px, var(--color-rule) 1px, transparent 0);
    background-size: 18px 18px;
    overflow: hidden; touch-action: none;
  }
  .chart-wrap svg { display: block; width: 100%; height: 540px; cursor: grab; user-select: none; }
  .chart-wrap svg.dragging { cursor: grabbing; }
  .flow-node { cursor: pointer; }
  .flow-node rect.body {
    fill: var(--color-paper-2); stroke: var(--color-rule-2); stroke-width: 1.4;
    transition: stroke var(--dur-micro) var(--ease-out), fill var(--dur-micro) var(--ease-out);
  }
  .flow-node:hover rect.body { stroke: var(--color-ink-2); }
  .flow-node.selected rect.body { stroke: var(--color-accent); stroke-width: 2; }
  .flow-node text.title { font-size: 13px; font-weight: 500; fill: var(--color-ink); }
  .flow-node text.meta { font-size: 12px; fill: var(--color-muted); }
  .flow-node text.attempt { font-size: 12px; fill: var(--color-muted); font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
  .flow-node.status-running rect.body { stroke: var(--color-cool); fill: var(--color-cool-soft); animation: nodePulse 1.8s ease-in-out infinite; }
  .flow-node.status-completed rect.body { stroke: var(--color-ok); fill: var(--color-ok-soft); }
  .flow-node.status-reused rect.body { stroke: var(--color-cool); fill: var(--color-cool-soft); }
  .flow-node.status-failed rect.body { stroke: var(--color-bad); fill: var(--color-bad-soft); }
  .flow-node.status-cancelled rect.body { stroke: var(--color-rule-2); fill: var(--color-paper-3); }
  .flow-node.status-archived rect.body { stroke: var(--color-rule); stroke-dasharray: 5 4; fill: var(--color-paper-3); }
  .flow-node.status-archived text.title { fill: var(--color-muted); }
  @keyframes nodePulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
  .flow-badge { font-size: 12px; font-weight: 500; }
  .flow-edge { fill: none; stroke-width: 1.6; }
  .flow-edge.success { stroke: var(--color-ok); }
  .flow-edge.active { stroke: var(--color-cool); stroke-dasharray: 6 4; animation: dash 1.2s linear infinite; }
  .flow-edge.failed { stroke: var(--color-bad); }
  .flow-edge.muted { stroke: var(--color-rule-2); stroke-dasharray: 4 5; }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .terminal-node rect { fill: var(--color-paper-3); stroke: var(--color-rule-2); stroke-width: 1.4; stroke-dasharray: 6 4; }
  .terminal-node text { font-size: 12px; fill: var(--color-ink-2); font-weight: 500; }
  .terminal-node.final rect { fill: var(--color-cool-soft); stroke: var(--color-cool); }
  .terminal-node.final text { fill: var(--color-ink); }
  .terminal-node.final.ok rect { fill: var(--color-ok-soft); stroke: var(--color-ok); }
  .terminal-node.final.ok text { fill: var(--color-ink); }
  .legend { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
  .legend span { display: inline-flex; align-items: center; gap: var(--space-2xs); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: var(--rule-hair) solid; }
  .legend .l-pending { background: var(--color-paper-2); border-color: var(--color-rule-2); }
  .legend .l-running { background: var(--color-cool-soft); border-color: var(--color-cool); }
  .legend .l-completed { background: var(--color-ok-soft); border-color: var(--color-ok); }
  .legend .l-reused { background: var(--color-cool-soft); border-color: var(--color-cool); }
  .legend .l-failed { background: var(--color-bad-soft); border-color: var(--color-bad); }
  .legend .l-archived { background: var(--color-paper-3); border-color: var(--color-rule); }
  .legend .l-chosen { background: var(--color-cool-soft); border-color: var(--color-cool); }
  .legend .l-unselected { background: var(--color-paper-3); border-color: var(--color-rule-2); border-style: dashed; }
  .legend .l-warn { background: var(--color-accent-soft); border-color: var(--color-accent); }
  .legend .l-skipped { background: var(--color-paper-3); border-color: var(--color-rule); border-style: dashed; }
  .route-summary { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; margin-bottom: var(--space-sm); }
  .route-summary .route-note {
    font-size: var(--text-xs); color: var(--color-ink-2); background: var(--color-paper-3);
    border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-chip);
    padding: var(--space-3xs) var(--space-xs); max-width: 100%; overflow-wrap: anywhere;
  }

  /* 完整执行路线 */
  .journey-wrap {
    position: relative; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card);
    background-color: var(--color-paper-2);
    background-image: radial-gradient(circle at 1px 1px, var(--color-rule) 1px, transparent 0);
    background-size: 18px 18px;
    overflow: hidden; touch-action: none;
  }
  .journey-wrap svg { display: block; width: 100%; height: 600px; cursor: grab; user-select: none; }
  .journey-wrap svg.dragging { cursor: grabbing; }
  .journey-node { cursor: pointer; }
  .journey-node rect.body {
    fill: var(--color-paper-2); stroke: var(--color-rule-2); stroke-width: 1.4;
    transition: stroke var(--dur-micro) var(--ease-out), fill var(--dur-micro) var(--ease-out);
  }
  .journey-node:hover rect.body { stroke: var(--color-ink-2); }
  .journey-node.selected rect.body { stroke: var(--color-accent); stroke-width: 2.4; }
  .journey-node text.j-title { font-size: 13px; font-weight: 500; fill: var(--color-ink); }
  .journey-node text.j-sub { font-size: 12px; fill: var(--color-muted); }
  .journey-node text.j-chip { font-size: 12px; fill: var(--color-ink-2); font-family: var(--font-outlier); font-variant-numeric: tabular-nums; }
  .journey-node.status-done rect.body { stroke: var(--color-ok); fill: var(--color-ok-soft); }
  .journey-node.status-active rect.body { stroke: var(--color-cool); fill: var(--color-cool-soft); animation: nodePulse 1.8s ease-in-out infinite; }
  .journey-node.status-failed rect.body { stroke: var(--color-bad); fill: var(--color-bad-soft); }
  .journey-node.status-warn rect.body { stroke: var(--color-accent); fill: var(--color-accent-soft); }
  .journey-node.status-skipped rect.body { stroke: var(--color-rule); stroke-dasharray: 5 4; fill: var(--color-paper-3); }
  .journey-node.status-skipped text.j-title { fill: var(--color-muted); }
  .journey-node.status-pending rect.body { stroke: var(--color-rule-2); fill: var(--color-paper-2); }
  .journey-node.status-chosen rect.body { stroke: var(--color-cool); stroke-width: 2.2; fill: var(--color-cool-soft); }
  .journey-node.status-unselected rect.body { stroke: var(--color-rule-2); stroke-dasharray: 5 4; fill: var(--color-paper-3); }
  .journey-node.status-unselected text.j-title { fill: var(--color-muted); }
  .journey-node.kind-terminal rect.body { fill: var(--color-cool-soft); stroke: var(--color-cool); stroke-dasharray: 6 4; }
  .journey-node.kind-terminal.status-done rect.body { fill: var(--color-ok-soft); stroke: var(--color-ok); }
  .journey-node.kind-terminal.status-failed rect.body { fill: var(--color-bad-soft); stroke: var(--color-bad); }
  .journey-node.kind-decision rect.body { stroke-dasharray: none; }
  .journey-node.kind-branch rect.body { rx: 14; }
  .journey-node.kind-phase rect.body { fill: var(--color-cool-soft); stroke: var(--color-cool); }
  .journey-node.kind-guard rect.body { fill: var(--color-accent-soft); stroke: var(--color-accent); stroke-dasharray: 6 4; }
  .j-edge { fill: none; stroke-width: 1.6; }
  .j-edge.success { stroke: var(--color-ok); }
  .j-edge.active { stroke: var(--color-cool); stroke-dasharray: 6 4; animation: dash 1.2s linear infinite; }
  .j-edge.failed { stroke: var(--color-bad); }
  .j-edge.warn { stroke: var(--color-accent); }
  .j-edge.muted { stroke: var(--color-rule-2); stroke-dasharray: 4 5; }
  .j-edge-label { font-size: 12px; fill: var(--color-ink-2); font-weight: 500; }
  .journey-empty { color: var(--color-muted); font-size: var(--text-xs); padding: var(--space-lg) 0; text-align: center; }
  .tool-call-list, .agent-call-list { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-xs); }
  .tool-call {
    border-left: 2px solid var(--color-cool); border-radius: var(--radius-chip); background: var(--color-paper-2); padding: var(--space-xs) var(--space-sm);
  }
  .agent-call {
    border-left: 2px solid var(--color-accent); border-radius: var(--radius-chip); background: var(--color-paper-2); padding: var(--space-xs) var(--space-sm);
  }
  .gen-tool {
    border-left: 2px solid var(--color-rule-2); border-radius: var(--radius-chip); background: var(--color-paper-2); padding: var(--space-xs) var(--space-sm);
  }
  .tool-call .top, .agent-call .top, .gen-tool .top { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
  .tool-call .name, .agent-call .name, .gen-tool .name { font-family: var(--font-outlier); font-size: var(--text-xs); font-weight: 500; }
  .tool-call .meta, .agent-call .meta, .gen-tool .meta { font-size: var(--text-xs); color: var(--color-muted); }
  .tool-call .io { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--space-2xs) var(--space-xs); margin-top: var(--space-xs); font-size: var(--text-xs); }
  .tool-call .io .k { color: var(--color-muted); }
  .tool-call .io .v { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .pill {
    display: inline-flex; align-items: center; padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-chip);
    font-size: var(--text-xs); font-weight: 500; border: var(--rule-hair) solid var(--color-rule); background: var(--color-paper-2); color: var(--color-ink-2);
  }
  .pill.ok { background: var(--color-ok-soft); color: var(--color-ink); border-color: var(--color-ok); }
  .pill.warn { background: var(--color-accent-soft); color: var(--color-ink); border-color: var(--color-accent); }
  .pill.err { background: var(--color-bad-soft); color: var(--color-ink); border-color: var(--color-bad); }
  .gen-tool .steps { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-xs); }
  .gen-step { font-size: var(--text-xs); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-chip); padding: var(--space-3xs) var(--space-xs); background: var(--color-paper-2); color: var(--color-muted); }
  .gen-step.ok { border-color: var(--color-ok); color: var(--color-ink); background: var(--color-ok-soft); }
  .gen-step.err { border-color: var(--color-bad); color: var(--color-ink); background: var(--color-bad-soft); }

  .node-detail { margin-top: var(--space-sm); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-md); background: var(--color-paper-3); }
  .node-detail .top { display: flex; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-xs); }
  .node-detail .top strong { font-size: var(--text-md); font-weight: 600; }
  .kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--space-2xs) var(--space-sm); font-size: var(--text-xs); }
  .kv .k { color: var(--color-muted); }
  .kv .v { color: var(--color-ink); overflow-wrap: anywhere; }
  .pre-block { white-space: pre-wrap; font-size: var(--text-xs); line-height: 1.65; background: var(--color-paper-3); color: var(--color-ink-2); border-radius: var(--radius-pill); padding: var(--space-xs) var(--space-sm); max-height: 220px; overflow: auto; }
  .pre-block.bad { background: var(--color-bad-soft); color: var(--color-ink); box-shadow: inset 3px 0 0 var(--color-bad); }
  .pre-block.plain { max-height: none; background: var(--color-paper-3); color: var(--color-ink-2); }

  /* 产物 */
  .artifacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--space-xs); }
  .artifact {
    border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-sm); background: var(--color-paper-2);
    display: flex; gap: var(--space-xs); align-items: center; min-width: 0;
    transition: border-color var(--dur-micro) var(--ease-out);
  }
  .artifact:hover { border-color: var(--color-rule-2); }
  .artifact .icon {
    width: 36px; height: 36px; border-radius: var(--radius-chip); display: grid; place-items: center; flex: none;
    background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); color: var(--color-ink-2);
    font-size: var(--text-lg);
  }
  .artifact .icon.image, .artifact .icon.text, .artifact .icon.archive, .artifact .icon.document { background: var(--color-paper-3); }
  .artifact .body { flex: 1; min-width: 0; }
  .artifact .name { font-size: var(--text-sm); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artifact .meta { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-3xs); }
  .artifact .ops { display: flex; gap: var(--space-3xs); flex: none; }
  .artifact .ops a, .artifact .ops button {
    border: none; background: transparent; color: var(--color-muted); cursor: pointer; border-radius: var(--radius-chip);
    padding: var(--space-2xs) var(--space-xs); font-size: var(--text-xs);
  }
  .artifact .ops a:hover, .artifact .ops button:hover { background: var(--color-paper-3); color: var(--color-ink); }
  .thumb { width: 100%; height: 110px; object-fit: cover; border-radius: var(--radius-chip); border: var(--rule-hair) solid var(--color-rule); margin-bottom: var(--space-xs); background: var(--color-paper-3); }

  /* 时间线 */
  .timeline { max-height: 330px; overflow: auto; padding-right: var(--space-2xs); }
  .tl-item { display: grid; grid-template-columns: 72px 12px minmax(0, 1fr); gap: var(--space-xs); align-items: start; padding: var(--space-3xs) 0; font-size: var(--text-xs); }
  .tl-item .time { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; color: var(--color-muted); padding-top: var(--space-3xs); }
  .tl-item .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: var(--space-2xs); background: var(--color-rule-2); }
  .tl-item.info .dot { background: var(--color-cool); }
  .tl-item.warn .dot { background: var(--color-accent); }
  .tl-item.error .dot { background: var(--color-bad); }
  .tl-item .msg { color: var(--color-ink-2); overflow-wrap: anywhere; }
  .timeline-empty { color: var(--color-muted); font-size: var(--text-xs); padding: var(--space-xs) 0; }

  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-md); }
  .review-box { font-size: var(--text-xs); color: var(--color-ink-2); background: var(--color-paper-3); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-pill); padding: var(--space-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
  .agent-list { display: flex; flex-direction: column; }
  .agent-row { display: flex; align-items: center; gap: var(--space-xs); font-size: var(--text-xs); padding: var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-rule); }
  .agent-row .name { font-family: var(--font-outlier); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-row .muted { color: var(--color-muted); }

  /* 人工指导 */
  .human-banner {
    display: flex; gap: var(--space-xs); align-items: flex-start; padding: var(--space-sm); border-radius: var(--radius-pill);
    background: var(--color-accent-soft); border: var(--rule-hair) solid var(--color-accent); color: var(--color-ink); font-size: var(--text-xs);
    line-height: 1.65; margin-bottom: var(--space-sm);
  }
  .human-banner .mark { flex: none; font-weight: 600; }
  .guidance-progress { display: flex; flex-direction: column; margin-bottom: var(--space-sm); }
  .progress-row {
    display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: var(--space-xs); align-items: center;
    padding: var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-rule); font-size: var(--text-xs);
  }
  .progress-row .sid { font-family: var(--font-outlier); color: var(--color-muted); }
  .progress-row .ptitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-row .pdetail { grid-column: 2 / -1; color: var(--color-muted); overflow-wrap: anywhere; }
  .gfield { margin-bottom: var(--space-sm); }
  .gfield label { display: block; font-size: var(--text-xs); color: var(--color-muted); margin-bottom: var(--space-2xs); }
  .gfield textarea {
    width: 100%; min-height: 62px; resize: vertical; padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-pill);
    border: var(--rule-hair) solid var(--color-field); background: var(--color-paper-3); line-height: 1.55;
  }
  .gfield .hintline { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-2xs); }
  .segmented { display: inline-flex; border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-pill); overflow: hidden; }
  .segmented button {
    border: none; background: var(--color-paper-2); padding: var(--space-3xs) var(--space-sm); font-size: var(--text-xs); color: var(--color-muted); cursor: pointer;
    border-right: var(--rule-hair) solid var(--color-rule);
  }
  .segmented button:last-child { border-right: none; }
  .segmented button.active { background: transparent; color: var(--color-ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--color-cool); }
  .rollback-list { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
  .rollback-list label {
    display: inline-flex; align-items: center; gap: var(--space-2xs); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-chip);
    border: var(--rule-hair) solid var(--color-rule-2); background: var(--color-paper-2); font-size: var(--text-xs); cursor: pointer;
  }
  .rollback-list label:hover { border-color: var(--color-ink-2); }
  .rollback-list input { margin: 0; }
  .guidance-actions { display: flex; gap: var(--space-xs); align-items: center; margin-top: var(--space-sm); }
  .guidance-actions .hint { flex: 1; font-size: var(--text-xs); color: var(--color-muted); }
  .guidance-note { margin-top: var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }

  /* 运维面板 */
  .ops-card { width: min(1080px, 100%); height: min(760px, 86vh); }
  .ops-head-tabs { display: flex; gap: var(--space-2xs); flex: none; }
  .ops-tab {
    border: var(--rule-hair) solid transparent; background: transparent; color: var(--color-muted); cursor: pointer;
    padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-chip); font-size: var(--text-xs);
  }
  .ops-tab:hover { background: var(--color-paper-3); color: var(--color-ink); }
  .ops-tab.active { background: var(--color-cool-soft); border-color: var(--color-cool); color: var(--color-ink); font-weight: 600; }
  .ops-content { padding: var(--space-md) var(--space-md) var(--space-lg); overflow: auto; flex: 1; }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: var(--space-sm); }
  .metric-card { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper-3); color: var(--color-ink); padding: var(--space-sm) var(--space-md); }
  .metric-card .label { font-size: var(--text-xs); color: var(--color-muted); }
  .metric-card .value { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; font-size: var(--text-2xl); font-weight: 400; margin-top: var(--space-3xs); letter-spacing: -0.02em; }
  .metric-card .sub { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-3xs); overflow-wrap: anywhere; }
  .ops-subhead { display: flex; align-items: center; gap: var(--space-xs); margin: var(--space-lg) 0 var(--space-xs); }
  .ops-subhead:first-child { margin-top: 0; }
  .ops-subhead h3 { font-size: var(--text-md); font-weight: 600; }
  .ops-subhead .sub { font-size: var(--text-xs); color: var(--color-muted); }
  .ops-subhead .spacer { flex: 1; }
  .kv-list { display: flex; flex-direction: column; }
  .kv-row {
    display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: var(--space-sm); align-items: center;
    padding: var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-rule); font-size: var(--text-xs);
  }
  .kv-row .k { color: var(--color-muted); }
  .kv-row .v { overflow-wrap: anywhere; }
  .tool-row, .svc-row {
    display: flex; gap: var(--space-sm); align-items: flex-start; padding: var(--space-sm) 0; border-bottom: var(--rule-hair) solid var(--color-rule);
  }
  .tool-row .main, .svc-row .main { flex: 1; min-width: 0; }
  .tool-row .name, .svc-row .name { font-family: var(--font-outlier); font-size: var(--text-xs); font-weight: 500; }
  .tool-row .desc, .svc-row .desc { font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-3xs); overflow-wrap: anywhere; }
  .tool-row .meta, .svc-row .meta { display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-xs); margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); }
  .tool-row .actions, .svc-row .actions { display: flex; gap: var(--space-2xs); flex: none; flex-wrap: wrap; justify-content: flex-end; }
  .empty-ops { padding: var(--space-xl) var(--space-xs); text-align: center; color: var(--color-muted); font-size: var(--text-xs); }
  .ops-note { font-size: var(--text-xs); color: var(--color-muted); line-height: 1.7; margin-top: var(--space-xs); }
  .ops-loading { color: var(--color-muted); font-size: var(--text-xs); padding: var(--space-xl) 0; text-align: center; }

  /* 模态与提示 */
  .modal { position: fixed; inset: 0; background: var(--color-scrim); display: none; align-items: center; justify-content: center; padding: var(--space-lg); z-index: var(--z-modal); }
  .modal.show { display: flex; }
  .modal-card {
    background: var(--color-paper-2); color: var(--color-ink); border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-card);
    width: min(880px, 100%); max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-card header { display: flex; align-items: center; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
  .modal-card header strong, .modal-card header h2 { flex: 1; font-size: var(--text-md); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-card .content { padding: var(--space-md); overflow: auto; }
  .modal-card iframe { width: 100%; height: 66vh; border: none; }
  .toast {
    position: fixed; left: 50%; bottom: var(--space-lg); transform: translateX(-50%) translateY(10px);
    background: var(--color-paper-3); color: var(--color-ink); border: var(--rule-hair) solid var(--color-rule-2); font-size: var(--text-xs); padding: var(--space-xs) var(--space-md); border-radius: var(--radius-pill);
    opacity: 0; pointer-events: none; transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out); z-index: var(--z-toast); max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .task-list { max-height: 220px; }
    .app { padding: var(--space-sm); }
    .task-head { flex-direction: column; }
    .workspace { min-height: 320px; }
  }
  @media (max-width: 600px) {
    .topbar { flex-wrap: wrap; }
    .brand { flex: 1 1 100%; }
    .topbar .spacer { display: none; }
    #lang-btn { margin-left: auto; }

  @media (max-width: 720px) {

    .ops-card { height: 92vh; }

    .ops-head-tabs { order: 3; width: 100%; overflow-x: auto; }
    .progress-row { grid-template-columns: 64px minmax(0, 1fr); }
    .progress-row .pill { grid-column: 2; justify-self: start; }
    .tool-row { flex-direction: column; }
    .tool-row .actions { width: 100%; justify-content: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <h1 data-i18n="app.title">SO-Agent 控制台</h1>
        <p data-i18n="app.subtitle">任务分解，多 Agent 执行，流程图与产物</p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="health" id="health"><span class="dot"></span><span id="health-text" data-i18n="health.connecting">连接中…</span></div>
    <button class="btn ghost small" id="lang-btn" title="Switch to English">EN</button>
    <button class="btn ghost small" id="ops-btn" data-i18n="nav.ops" data-i18n-title="nav.opsTitle" title="运行指标、工具库与 MCP 目录">运维</button>
    <button class="btn ghost small" id="refresh-btn" data-i18n="nav.refresh" data-i18n-title="nav.refreshTitle" title="立即刷新">刷新</button>
  </header>

  <div class="layout">
    <!-- 左栏：提问 + 任务列表 -->
    <div>
      <section class="panel ask">
        <div class="panel-head"><h2 data-i18n="ask.title">提问</h2></div>
        <div class="panel-body">
          <form id="ask-form">
            <textarea id="objective" data-i18n-placeholder="ask.objectivePlaceholder" placeholder="描述你的任务，例如：分析这个仓库的结构并给出改造建议，最后生成一份报告。" maxlength="20000"></textarea>
            <details class="advanced">
              <summary data-i18n="ask.advanced">约束与验收标准（可选）</summary>
              <div class="field">
                <label for="constraints" data-i18n="ask.constraints">约束条件</label>
                <textarea id="constraints" maxlength="20000" data-i18n-placeholder="ask.constraintsPlaceholder" placeholder="例如：仅使用标准库；不得访问沙箱之外的目录"></textarea>
              </div>
              <div class="field">
                <label for="acceptance" data-i18n="ask.acceptance">验收标准</label>
                <textarea id="acceptance" maxlength="20000" data-i18n-placeholder="ask.acceptancePlaceholder" placeholder="例如：提供可运行脚本，并附自我验证结果"></textarea>
              </div>
            </details>
            <div class="row">
              <span class="hint" id="shortcut-hint"><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> <span data-i18n="ask.shortcut">提交</span></span>
              <button class="btn primary" type="submit" id="submit-btn" data-i18n="ask.submit">开始执行</button>
            </div>
            <div class="error" id="ask-error"></div>
          </form>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2 data-i18n="tasks.title">任务</h2><span class="count" id="task-count">0</span></div>
        <div class="panel-body">
          <div class="task-list" id="task-list"><div class="empty-inline" data-i18n="tasks.empty">暂无任务</div></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2 data-i18n="sched.title">定时任务</h2><span class="count" id="sched-count">0</span></div>
        <div class="panel-body">
          <div class="task-list" id="sched-list"><div class="empty-inline" data-i18n="sched.empty">暂无定时任务</div></div>
        </div>
      </section>
    </div>

    <!-- 右栏：工作区 -->
    <main class="panel workspace" id="workspace">
      <div class="empty-state">
        <h3 data-i18n="workspace.emptyTitle">从一个问题开始</h3>
        <p data-i18n="workspace.emptyText">提交任务后，这里会实时展示四象限分类、任务分解路线图、每个子任务的执行状态、完整时间线与最终产物。</p>
      </div>
    </main>
  </div>

  <div class="footer" data-i18n="footer.text">so-agent，默认仅监听 127.0.0.1；所有产物位于任务独立沙箱</div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <header><h2 id="modal-title" data-i18n="modal.preview">预览</h2><button class="btn ghost small" id="modal-close" data-i18n="common.close">关闭</button></header>
    <div class="content" id="modal-content"></div>
  </div>
</div>

<div class="modal" id="ops-modal">
  <div class="modal-card ops-card">
    <header>
      <h2 data-i18n="ops.title">运行与工具运维</h2>
      <div class="ops-head-tabs" id="ops-tabs">

        <button class="ops-tab" data-ops-tab="tools" data-i18n="ops.tabTools">工具库</button>
        <button class="ops-tab" data-ops-tab="mcp" data-i18n="ops.tabMcp">MCP 服务</button>
      </div>
      <button class="btn ghost small" id="ops-refresh" data-i18n="nav.refresh">刷新</button>
      <button class="btn ghost small" id="ops-close" data-i18n="common.close">关闭</button>
    </header>
    <div class="ops-content" id="ops-content"><div class="ops-loading" data-i18n="common.loading">加载中…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

  function t(key, vars) {
    var table = I18N[state.lang] || I18N.zh;
    var text = table[key];
    if (text == null) {
      text = I18N.zh[key] != null ? I18N.zh[key] : key;
    }
    if (vars) {
      text = text.replace(/\{(\w+)\}/g, function (match, name) {
        return vars[name] == null ? match : String(vars[name]);
      });
    }
    return text;
  }

  function tCount(key, count, vars) {
    var one = key + ".one";
    var table = I18N[state.lang] || I18N.zh;
    return t(count === 1 && table[one] != null ? one : key, vars);
  }

  function labelFor(prefix, value) {
    return t(prefix + "." + value);
  }

  var TERMINAL = new Set(["completed", "failed", "cancelled", "human_required"]);
  function statusLabel(value) { return labelFor("status", value); }
  function phaseLabel(value) { return labelFor("phase", value); }
  function nodeStatusLabel(value) { return labelFor("nodeStatus", value); }
  function journeyStatusLabel(value) { return labelFor("journeyStatus", value); }
  function journeyKindLabel(value) { return labelFor("journeyKind", value); }

  var JOURNEY_STATUS_COLOR = {
    done: "var(--color-ok)", active: "var(--color-accent)", pending: "var(--color-rule-2)", failed: "var(--color-bad)",
    warn: "var(--color-accent)", skipped: "var(--color-rule)", chosen: "var(--color-cool)", unselected: "var(--color-rule-2)"
  };

  var state = {
    lang: readLang(),
    selected: null,
    detail: null,
    tasks: [],
    version: null,
    followCurrent: true,
    selectedNode: null,
    view: null,
    base: null,
    journeyView: null,
    journeyBase: null,
    journeySize: "",
    journeySelected: null,
    lastPayload: "",
    tasksSignature: "",
    scheduled: [],
    scheduledSignature: "",
    scheduledExpanded: {},
    scheduledRuns: {},
    schedPolicy: null,
    loading: false,
    tick: 0,
    online: null,
    ops: { tab: "metrics", data: null, tools: null, mcp: null, loading: false, error: "" },
    guidance: { action: "rollback" }
  };

  var $ = function (id) { return document.getElementById(id); };

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function locale() {
    return state.lang === "en" ? "en-US" : "zh-CN";
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    var date = new Date(iso);
    if (isNaN(date.getTime())) return "—";
    return date.toLocaleTimeString(locale(), { hour12: false });
  }

  function fmtDateTime(iso) {
    if (!iso) return "—";
    var date = new Date(iso);
    if (isNaN(date.getTime())) return "—";
    return date.toLocaleString(locale(), { hour12: false });
  }

  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / 1024 / 1024).toFixed(1) + " MB";
  }

  function fmtDuration(seconds) {
    var total = Math.max(0, Math.round(seconds || 0));
    if (total < 60) return t("duration.seconds", { n: total });
    var minutes = Math.floor(total / 60);
    var rest = total % 60;
    if (minutes < 60) {
      return t("duration.minutes", { m: minutes, s: rest });
    }
    return t("duration.hours", {
      h: Math.floor(minutes / 60),
      m: minutes % 60
    });
  }

  function elapsed(task) {
    var start = task.started_at || task.created_at;
    if (!start) return 0;
    var end = task.finished_at ? new Date(task.finished_at) : new Date();
    var startDate = new Date(start);
    if (isNaN(startDate.getTime())) return 0;
    return Math.max(0, (end - startDate) / 1000);
  }

  function toast(message, isError) {
    var node = $("toast");
    node.textContent = message;
    node.className = "toast show" + (isError ? " error" : "");
    clearTimeout(node._timer);
    node._timer = setTimeout(function () { node.className = "toast"; }, 3200);
  }

  function localizeServerMessage(message) {
    if (state.lang !== "en" || !message) return message;
    var known = {
      "需要访问令牌": "Access token required.",
      "任务不存在": "Task not found",
      "任务目标不能为空": "Task objective cannot be empty",
      "任务仍在运行，无法提交指导": "Task is still running; guidance cannot be submitted",
      "Web 控制台正在关闭，不接受新动作": "Web console is shutting down; no new actions accepted",
      "Web 控制台正在关闭，不接受新任务": "Web console is shutting down; new tasks are rejected",
      "该类型仅支持附件下载": "This file type can only be downloaded as an attachment",
      "非法产物路径": "Invalid artifact path",
      "产物路径越界": "Artifact path escapes the task sandbox",
      "该路径不对外提供": "This path is not exposed",
      "产物不存在": "Artifact not found",
      "产物超过下载大小上限": "Artifact exceeds the download size limit",
      "服务重启，任务被中断；请重新提交。": "The service restarted and interrupted this task; please submit it again.",
      "服务重启导致运行时状态丢失，人工指导无法恢复；请重新提交。": "The service restarted and lost the runtime state; guidance cannot resume this task. Please submit it again."
    };
    if (known[message]) return known[message];
    var patterns = [
      [/^任务目标超过 (\d+) 字符上限$/, "Task objective exceeds the $1-character limit"],
      [/^约束条件超过 (\d+) 字符上限$/, "Constraints exceed the $1-character limit"],
      [/^验收标准超过 (\d+) 字符上限$/, "Acceptance criteria exceed the $1-character limit"],
      [/^任务数量已达上限（(\d+)），请先清理已完成任务$/,
        "Task limit reached ($1); clear finished tasks first"],
      [/^任务当前状态为 '?([^'，]+)'?，仅 human_required 可提交指导$/,
        "Task is in state $1; guidance is only accepted in human_required"]
    ];
    for (var i = 0; i < patterns.length; i += 1) {
      if (patterns[i][0].test(message)) {
        return message.replace(patterns[i][0], patterns[i][1]);
      }
    }
    return message;
  }

  function withLang(path) {
    if (path.indexOf("/api/") !== 0) return path;
    return path + (path.indexOf("?") >= 0 ? "&" : "?") + "lang=" + state.lang;
  }

  async function api(path, options) {
    var config = Object.assign({ credentials: "same-origin" }, options || {});
    if (config.body && !config.headers) config.headers = { "Content-Type": "application/json" };
    var response = await fetch(withLang(path), config);
    if (!response.ok) {
      if (response.status === 401) {
        throw new Error(t("error.auth"));
      }
      var detail = "";
      try { detail = (await response.json()).detail || ""; } catch (e) { /* ignore */ }
      throw new Error(localizeServerMessage(detail) || ("HTTP " + response.status));
    }
    return response.json();
  }

  /* ------------------------------ 提交 ------------------------------ */
  async function submitTask(event) {
    event.preventDefault();
    var objective = $("objective").value.trim();
    var errorBox = $("ask-error");
    errorBox.classList.remove("show");
    if (!objective) {
      errorBox.textContent = t("error.objective");
      errorBox.classList.add("show");
      $("objective").focus();
      return;
    }
    var button = $("submit-btn");
    button.disabled = true;
    button.textContent = t("common.submitting");
    try {
      var data = await api("/api/tasks", {
        method: "POST",
        body: JSON.stringify({
          objective: objective,
          constraints: $("constraints").value,
          acceptance_criteria: $("acceptance").value
        })
      });
      $("objective").value = "";
      $("constraints").value = "";
      $("acceptance").value = "";
      state.followCurrent = true;
      state.version = null;
      state.lastPayload = "";
      await selectTask(data.task_id, true);
      toast(t("toast.submitted"));
      $("objective").focus();
    } catch (err) {
      errorBox.textContent = localizeServerMessage(err.message || String(err));
      errorBox.classList.add("show");
    } finally {
      button.disabled = false;
      button.textContent = t("ask.submit");
    }
  }

  /* ------------------------------ 轮询 ------------------------------ */
  async function loadHealth() {
    try {
      var data = await api("/api/health");
      state.online = true;
      $("health").className = "health ok";
      $("health-text").textContent = t("health.ok") +
        (data.auth_required ? t("health.token") : "");
    } catch (err) {
      state.online = false;
      $("health").className = "health off";
      $("health-text").textContent = t("health.off");
    }
  }

  async function loadTasks() {
    var data = await api("/api/tasks");
    var tasks = data.tasks || [];
    var signature = JSON.stringify(tasks);
    if (signature === state.tasksSignature) return;
    state.tasksSignature = signature;
    state.tasks = tasks;
    renderTaskList();
  }

  async function loadScheduledTasks() {
    try {
      var data = await api("/api/scheduled-tasks");
      var tasks = data.tasks || [];
      state.schedPolicy = data.policy || null;
      var signature = JSON.stringify(tasks);
      if (signature === state.scheduledSignature) return;
      state.scheduledSignature = signature;
      state.scheduled = tasks;
      renderScheduledTasks();
    } catch (err) {
      /* 调度查询失败不阻塞主任务轮询 */
    }
  }

  async function refreshDetail(force) {
    if (!state.selected) return;
    var data = await api("/api/tasks/" + encodeURIComponent(state.selected));
    var payload = JSON.stringify(data);
    if (!force && payload === state.lastPayload) return;
    state.lastPayload = payload;
    state.detail = data;
    var current = Math.max(1, (data.plan && data.plan.current) || 1);
    if (state.version == null || state.followCurrent) state.version = current;
    try {
      renderWorkspace();
    } catch (err) {
      console.error("render failed", err);
      toast(t("error.render") + (err && err.message ? err.message : err), true);
    }
  }

  async function selectTask(taskId, force) {
    state.selected = taskId;
    state.version = null;
    state.followCurrent = true;
    state.selectedNode = null;
    state.view = null;
    state.journeyView = null;
    state.journeySize = "";
    state.journeySelected = null;
    state.lastPayload = "";
    state.guidance = { action: "rollback" };
    renderTaskList();
    try {
      await refreshDetail(true);
    } catch (err) {
      toast(err.message || String(err), true);
    }
    if (force) $("workspace").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  async function tick() {
    if (state.loading) return;
    state.loading = true;
    try {
      await loadTasks();
      if (state.tick % 4 === 0) await loadScheduledTasks();
      if (state.selected) {
        var active = state.detail && !TERMINAL.has(state.detail.status);
        if (active || state.tick % 4 === 0) await refreshDetail(false);
      }
      if (!state.online) await loadHealth();
    } catch (err) {
      if (state.online !== false) await loadHealth();
    } finally {
      state.loading = false;
      state.tick += 1;
    }
  }

  /* ------------------------------ 任务列表 ------------------------------ */
  function fitTaskTitles(host) {
    // 每帧重建列表，避免逐帧累积省略号；CSS 的 ellipsis 会留下溢出文本盒，
    // 这里按真实字宽截断，保证文本只占可见区域。原文另存，窗口变宽后可还原。
    var ctx = fitTaskTitles.ctx;
    if (!ctx) ctx = fitTaskTitles.ctx = document.createElement("canvas").getContext("2d");
    Array.prototype.forEach.call(host.querySelectorAll(".task-item .title"), function (el) {
      var full = el.getAttribute("data-full-title");
      if (full == null) {
        full = el.textContent;
        el.setAttribute("data-full-title", full);
      }
      var cs = getComputedStyle(el);
      ctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      var max = el.clientWidth;
      if (!max || ctx.measureText(full).width <= max) {
        el.textContent = full;
        return;
      }
      var lo = 0, hi = full.length;
      while (lo < hi) {
        var mid = Math.ceil((lo + hi) / 2);
        if (ctx.measureText(full.slice(0, mid) + "…").width <= max) lo = mid;
        else hi = mid - 1;
      }
      el.textContent = full.slice(0, lo) + "…";
    });
  }

  function renderTaskList() {
    $("task-count").textContent = String(state.tasks.length);
    var host = $("task-list");
    var scrollTop = host.scrollTop;
    if (!state.tasks.length) {
      host.innerHTML = '<div class="empty-inline">' + esc(t("tasks.empty")) + "</div>";
      return;
    }
    host.innerHTML = state.tasks.map(function (task) {
      var active = task.task_id === state.selected ? " active" : "";
      var type = task.task_type
        ? '<span class="tag mono">' + esc(task.task_type) + "</span>" : "";
      return '<div class="task-item' + active + '" data-task-id="' + esc(task.task_id) + '" role="button" tabindex="0">' +
        '<div class="line1"><span class="status-dot ' + esc(task.status) + '"></span>' +
        '<span class="title">' + esc(task.objective) + "</span></div>" +
        '<div class="meta"><span>' + esc(statusLabel(task.status)) + "</span>" +
        "<span>" + esc(fmtDateTime(task.created_at)) + "</span>" + type + "</div></div>";
    }).join("");
    fitTaskTitles(host);
    host.scrollTop = scrollTop;
  }

  function scheduleText(schedule) {
    if (!schedule) return "";
    var parts = [];
    if (schedule.trigger === "cron" && schedule.cron) parts.push(schedule.cron);
    else if (schedule.trigger === "interval" && schedule.interval_seconds) {
      parts.push(schedule.interval_seconds + "s");
    } else parts.push(schedule.trigger);
    if (schedule.timezone) parts.push(schedule.timezone);
    return parts.join(" · ");
  }

  function renderSchedRun(run) {
    var detail = run.error
      ? t("sched.error") + run.error
      : (run.result ? t("sched.result") + run.result : "");
    return '<div class="sched-run"><span class="run-status">' +
      esc(statusLabel(run.status)) + "</span><span>" +
      esc(fmtDateTime(run.started_at)) + "</span>" +
      '<span class="run-detail" title="' + esc(detail) + '">' +
      esc(detail) + "</span></div>";
  }

  function renderScheduledTasks() {
    $("sched-count").textContent = String(state.scheduled.length);
    var host = $("sched-list");
    var scrollTop = host.scrollTop;
    if (!state.scheduled.length) {
      host.innerHTML = '<div class="empty-inline">' + esc(t("sched.empty")) + "</div>";
      return;
    }
    host.innerHTML = state.scheduled.map(function (task) {
      var next = task.next_run_at
        ? t("sched.next") + " " + fmtDateTime(task.next_run_at)
        : t("sched.none");
      var failures = task.consecutive_failures > 0
        ? "<span>" + esc(t("sched.failures", { n: task.consecutive_failures })) + "</span>"
        : "";
      return '<div class="task-item" data-sched-id="' + esc(task.task_id) +
        '" role="button" tabindex="0">' +
        '<div class="line1"><span class="status-dot ' + esc(task.status) + '"></span>' +
        '<span class="title">' + esc(task.objective) + "</span></div>" +
        '<div class="meta"><span>' + esc(statusLabel(task.status)) + "</span>" +
        "<span>" + esc(next) + "</span>" +
        "<span>" + esc(scheduleText(task.schedule)) + "</span>" + failures + "</div></div>";
    }).join("");
    fitTaskTitles(host);
    state.scheduled.forEach(function (task) {
      if (!state.scheduledExpanded[task.task_id]) return;
      var runs = state.scheduledRuns[task.task_id];
      if (!runs) return;
      var item = host.querySelector(
        '[data-sched-id="' + task.task_id + '"]'
      );
      if (item) item.appendChild(schedRunsBox(runs));
      refreshSchedRuns(task.task_id);
    });
    host.scrollTop = scrollTop;
  }

  async function refreshSchedRuns(taskId) {
    try {
      var detail = await api("/api/scheduled-tasks/" + encodeURIComponent(taskId));
      if (!state.scheduledExpanded[taskId]) return;
      var runs = detail.runs || [];
      state.scheduledRuns[taskId] = runs;
      var item = $("sched-list").querySelector(
        '[data-sched-id="' + taskId + '"]'
      );
      var box = item && item.querySelector(".sched-runs");
      if (box && !box.hidden) box.replaceWith(schedRunsBox(runs));
    } catch (err) {
      /* 展开区域刷新失败不影响列表轮询 */
    }
  }

  function schedRunsBox(runs) {
    var box = document.createElement("div");
    box.className = "sched-runs";
    var html = '<div class="sched-run"><span class="run-status">' +
      esc(t("sched.runs")) + "</span><span>" + runs.length + "</span></div>";
    html += runs.length
      ? runs.map(renderSchedRun).join("")
      : '<div class="sched-empty">' + esc(t("sched.noRuns")) + "</div>";
    box.innerHTML = html;
    return box;
  }

  async function toggleScheduledRuns(item) {
    var taskId = item.getAttribute("data-sched-id");
    if (!taskId) return;
    var existing = item.querySelector(".sched-runs");
    if (existing) {
      existing.hidden = !existing.hidden;
      state.scheduledExpanded[taskId] = !existing.hidden;
      return;
    }
    try {
      var detail = await api("/api/scheduled-tasks/" + encodeURIComponent(taskId));
      var runs = detail.runs || [];
      state.scheduledRuns[taskId] = runs;
      state.scheduledExpanded[taskId] = true;
      item.appendChild(schedRunsBox(runs));
    } catch (err) {
      toast(t("sched.loadFailed") + (err && err.message ? err.message : err), true);
    }
  }

  /* ------------------------------ 工作区 ------------------------------ */
  function statusTagClass(status) {
    if (status === "completed") return "green";
    if (status === "completed_provisional") return "blue";
    if (status === "failed") return "red";
    if (status === "cancelled") return "amber";
    if (status === "human_required") return "amber";
    if (status === "running") return "blue";
    return "";
  }

  function stageIndex(detail) {
    if (!detail.classification) return 0;
    var phase = detail.phase || detail.status;
    if (phase === "received") return 1;
    if (phase === "planning" || phase === "plan_review" || phase === "replanning") return 1;
    if (phase === "executing" || phase === "decomposition_issue" ||
        phase === "replacement_requested" || phase === "replacement_executing") return 2;
    if (phase === "aggregating") return 3;
    if (phase === "result_review") return 4;
    return 5;
  }

  function renderStagebar(detail) {
    var stages = [
      t("stage.classify"), t("stage.plan"), t("stage.execute"),
      t("stage.aggregate"), t("stage.review"), t("stage.end")
    ];
    var index = stageIndex(detail);
    var terminal = TERMINAL.has(detail.status);
    var html = '<div class="stagebar">';
    stages.forEach(function (name, i) {
      var cls = "";
      if (i < index || (terminal && i <= index)) cls = "done";
      if (i === index && !terminal) cls = "active";
      if (i === index && terminal) cls = "done";
      html += '<div class="stage ' + cls + '"><span class="bubble">' + (cls === "done" ? "✓" : (i + 1)) + "</span>" +
        '<span class="name">' + esc(name) + "</span></div>";
      if (i < stages.length - 1) html += '<span class="connector"></span>';
    });
    return html + "</div>";
  }

  function renderResult(detail) {
    var notice = detail.notice
      ? '<div class="placeholder-text" style="margin-bottom:8px">' +
        esc(t("result.notice")) + "：" + esc(detail.notice) + "</div>" : "";
    var previous = detail.previous_result
      ? '<details style="margin-top:10px"><summary>' +
        esc(t("result.previous")) + "</summary><div>" +
        renderMarkdown(detail.previous_result) + "</div></details>" : "";
    if (detail.final_result) {
      return '<div class="result">' + notice +
        renderMarkdown(detail.final_result) + previous + "</div>";
    }
    if (TERMINAL.has(detail.status)) {
      return '<div class="result">' + notice + '<span class="placeholder-text">' +
        (detail.status === "cancelled" ? t("result.cancelled") :
         detail.status === "failed" ? t("result.failed", {
           error: esc(detail.error || t("result.noError"))
         }) :
         t("result.empty")) + "</span></div>";
    }
    return '<div class="result"><div class="skeleton-line" style="width:82%"></div>' +
      '<div class="skeleton-line" style="width:64%"></div>' +
      '<div class="skeleton-line" style="width:73%"></div>' +
      '<div class="placeholder-text">' + esc(t("result.running")) + "</div></div>";
  }

  function renderArtifacts(detail) {
    if (!detail.artifacts || !detail.artifacts.length) {
      return '<div class="placeholder-text">' +
        (TERMINAL.has(detail.status) ? t("artifacts.none") : t("artifacts.running")) +
        "</div>";
    }
    return '<div class="artifacts">' + detail.artifacts.map(function (item) {
      var base = "/api/tasks/" + encodeURIComponent(detail.task_id) + "/artifacts/" +
        item.path.split("/").map(encodeURIComponent).join("/");
      var icon = item.kind === "image" ? "▧" : item.kind === "text" ? "≡" :
        item.kind === "archive" ? "▤" : item.kind === "document" ? "▣" : "◻";
      var thumb = item.kind === "image"
        ? '<img class="thumb" loading="lazy" alt="" src="' + esc(base) + '?inline=1">' : "";
      var previewable = item.kind === "text" || /\.pdf$/i.test(item.name);
      return '<div class="artifact"><div class="icon ' + esc(item.kind) + '">' + icon + "</div>" +
        '<div class="body"><div class="name" title="' + esc(item.path) + '">' + esc(item.name) + "</div>" +
        '<div class="meta">' + esc(fmtSize(item.size)) + " · " + esc(fmtDateTime(item.modified_at)) + "</div>" +
        (thumb ? '<div style="margin-top:8px">' + thumb + "</div>" : "") + "</div>" +
        '<div class="ops">' +
        (previewable ? '<button data-preview="' + esc(base) + '" data-name="' + esc(item.name) + '">' + esc(t("artifacts.preview")) + "</button>" : "") +
        '<a href="' + esc(base) + '" download>' + esc(t("artifacts.download")) + "</a></div></div>";
    }).join("") + "</div>";
  }

  function renderTimeline(detail) {
    var timeline = detail.timeline || [];
    if (!timeline.length) return '<div class="timeline-empty">' + esc(t("timeline.empty")) + "</div>";
    return '<div class="timeline" id="timeline">' + timeline.map(function (item) {
      return '<div class="tl-item ' + esc(item.level || "info") + '">' +
        '<span class="time">' + esc(fmtTime(item.timestamp)) + "</span>" +
        '<span class="dot"></span>' +
        '<span class="msg">' + esc(item.message) + "</span></div>";
    }).join("") + "</div>";
  }

      '<div class="review-box">' + esc(detail.review_summary) + "</div></section>";

  function renderAgents(detail) {

      }).join("") + "</div></section>";

  function renderGuidance(detail) {
    if (detail.status !== "human_required" || !detail.human_escalation) return "";
    var escalation = detail.human_escalation;
    var progress = escalation.progress || [];
    var targets = escalation.rollback_targets || [];
    var action = state.guidance.action;
    var last = detail.human_guidance;
    var titleById = {};
    progress.forEach(function (item) { titleById[item.subtask_id] = item.title || ""; });
    var actionLabels = {
      rollback: t("guidance.rollback"),
      resume: t("guidance.resume"),
      abort: t("guidance.abort")
    };

    var html = '<section class="section"><div class="section-head"><h3>' + esc(t("guidance.title")) + "</h3>" +
      '<span class="sub">' + esc(t("guidance.sub")) + "</span></div>" +
      '<div class="human-banner"><span class="mark">!</span><div>' +
      esc(escalation.reason || t("guidance.defaultReason")) + "</div></div>";

    if (last) {
      html += '<div class="guidance-note">' + esc(t("guidance.lastAction")) +
        esc(actionLabels[last.action] || last.action) +
        (last.rollback_to && last.rollback_to.length ? " → " + esc(last.rollback_to.join(t("common.separator"))) : "") +
        (detail.error ? esc(t("guidance.notResumed")) + esc(detail.error) : "") + "</div>";
    }

    if (progress.length) {
      html += '<div class="ops-subhead" style="margin-top:14px"><h3>' + esc(t("guidance.progress")) + "</h3></div>" +
        '<div class="guidance-progress">' + progress.map(function (item) {
          var cls = item.status === "completed" ? "ok" : item.status === "failed" ? "err" : "warn";
          var label = {
            completed: t("status.completed"),
            failed: t("status.failed"),
            pending: t("nodeStatus.pending")
          }[item.status] || item.status;
          var extra = item.error || item.output_preview || "";
          return '<div class="progress-row"><span class="sid">' + esc(item.subtask_id) + "</span>" +
            '<span class="ptitle" title="' + esc(item.title) + '">' + esc(item.title || t("guidance.unnamed")) + "</span>" +
            '<span class="pill ' + cls + '">' + esc(label) + "</span>" +
            (extra ? '<span class="pdetail">' + esc(extra) + "</span>" : "") + "</div>";
        }).join("") + "</div>";
    }

    html += '<div class="gfield"><label>' + esc(t("guidance.actionLabel")) + "</label>" +
      '<div class="segmented" id="guidance-actions">' +
      ["rollback", "resume", "abort"].map(function (value) {
        return '<button type="button" data-guidance-action="' + value + '"' +
          (value === action ? ' class="active"' : "") + ">" + esc(actionLabels[value]) + "</button>";
      }).join("") + "</div>" +
      '<div class="hintline">' + esc(t("guidance.actionHint")) + "</div></div>";

    html += '<div class="gfield"><label>' + esc(t("guidance.targets")) + "</label>";
    if (targets.length) {
      html += '<div class="rollback-list">' + targets.map(function (sid) {
        var title = titleById[sid] ? " · " + titleById[sid] : "";
        return '<label><input type="checkbox" name="guidance-rollback" value="' + esc(sid) + '">' +
          esc(sid) + esc(title) + "</label>";
      }).join("") + "</div>";
    } else {
      html += '<div class="hintline">' + esc(t("guidance.noTargets")) + "</div>";
    }
    html += "</div>";

    html += '<div class="gfield"><label for="guidance-instructions">' + esc(t("guidance.instructions")) + "</label>" +
      '<textarea id="guidance-instructions" maxlength="8000" placeholder="' + esc(t("guidance.instructionsPlaceholder")) + '"></textarea></div>';
    html += '<div class="gfield"><label for="guidance-additional">' + esc(t("guidance.additional")) + "</label>" +
      '<textarea id="guidance-additional" maxlength="8000" placeholder="' + esc(t("guidance.additionalPlaceholder")) + '"></textarea></div>';
    html += '<div class="guidance-actions"><span class="hint">' + esc(t("guidance.submitHint")) + "</span>" +
      '<button class="btn primary small" id="guidance-submit">' + esc(t("guidance.submit")) + "</button></div></section>";
    return html;

  function nearBottom(node) {
    if (!node) return true;
    return node.scrollHeight - node.scrollTop - node.clientHeight < 40;
