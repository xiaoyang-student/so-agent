  /* ------------------------------ 版本与流程图 ------------------------------ */
  function currentPlanVersion() {
    var plan = state.detail && state.detail.plan;
    if (!plan || !plan.versions || !plan.versions.length) return null;
    if (state.followCurrent) return plan.versions[plan.versions.length - 1];
    var found = plan.versions.find(function (item) { return item.version === state.version; });
    return found || plan.versions[plan.versions.length - 1];
  }

  function renderVersionTabs() {
    var host = $("version-tabs");
    if (!host) return;
    var plan = state.detail.plan;
    if (!plan || !plan.versions || !plan.versions.length) {
      host.innerHTML = "";
      return;
    }
    host.innerHTML = plan.versions.map(function (version) {
      var active = state.version === version.version ? " active" : "";
      var reused = version.nodes.filter(function (node) { return node.status === "reused"; }).length;
      var badge = reused ? '<span class="badge">' + esc(t("plan.reused", { n: reused })) + "</span>" : "";
      return '<button class="version-tab' + active + '" data-version="' + version.version + '">' +
        esc(t("plan.version", { n: version.version })) + badge + "</button>";
    }).join("");
    var sub = $("chart-sub");
    if (sub) {
      var version = currentPlanVersion();
      var count = version ? version.nodes.length : 0;
      sub.textContent = count
        ? tCount("plan.count", count, { n: count, m: plan.replan_count || 0 })
        : t("plan.waiting");
    }
  }

  function wrapLines(text, maxChars, maxLines) {
    var chars = Array.from(String(text || ""));
    var lines = [];
    for (var i = 0; i < chars.length && lines.length < maxLines; i += maxChars) {
      lines.push(chars.slice(i, i + maxChars).join(""));
    }
    if (lines.length === maxLines && chars.length > maxChars * maxLines) {
      lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + "…";
    }
    return lines.length ? lines : [t("plan.unknownTitle")];
  }

  function nodeVisual(status) {
    return {
      pending: "var(--color-rule-2)", running: "var(--color-cool)", completed: "var(--color-ok)",
      reused: "var(--color-cool)", failed: "var(--color-bad)", cancelled: "var(--color-muted)", archived: "var(--color-muted)"
    }[status] || "var(--color-muted)";
  }

  function edgeStatus(source, target) {
    var ok = new Set(["completed", "reused"]);
    if ((source && source.status === "failed") || (target && target.status === "failed")) return "failed";
    if ((source && source.status === "running") || (target && target.status === "running")) return "active";
    if (source && target && ok.has(source.status) && ok.has(target.status)) return "success";
    return "muted";
  }

  function buildGraph(version) {
    var nodes = version.nodes || [];
    var byId = new Map();
    nodes.forEach(function (node) { byId.set(node.id, node); });
    var level = new Map();
    var visiting = new Set();

    function resolveLevel(id) {
      if (level.has(id)) return level.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);
      var node = byId.get(id);
      var value = 0;
      (node && node.dependencies || []).forEach(function (dep) {
        if (byId.has(dep)) value = Math.max(value, resolveLevel(dep) + 1);
      });
      visiting.delete(id);
      level.set(id, value);
      return value;
    }
    nodes.forEach(function (node) { resolveLevel(node.id); });

    var rows = [];
    nodes.forEach(function (node) {
      var index = level.get(node.id) || 0;
      if (!rows[index]) rows[index] = [];
      rows[index].push(node);
    });
    var rowCount = Math.max(1, rows.length);
    var maxCount = Math.max.apply(null, rows.map(function (row) { return row ? row.length : 0; }).concat([1]));

    var NODE_W = 216, NODE_H = 92, GAP_X = 44, GAP_Y = 78, PAD = 46;
    var width = Math.max(780, PAD * 2 + maxCount * NODE_W + Math.max(0, maxCount - 1) * GAP_X);
    var height = PAD * 2 + (NODE_H + GAP_Y) * (rowCount + 1) + NODE_H;
    var positions = new Map();

    rows.forEach(function (row, rowIndex) {
      if (!row) return;
      var count = row.length;
      var total = count * NODE_W + (count - 1) * GAP_X;
      var startX = (width - total) / 2;
      row.forEach(function (node, index) {
        positions.set(node.id, {
          node: node,
          x: startX + index * (NODE_W + GAP_X),
          y: PAD + NODE_H + GAP_Y + rowIndex * (NODE_H + GAP_Y),
          w: NODE_W, h: NODE_H
        });
      });
    });

    var entry = { x: width / 2 - 92, y: PAD, w: 184, h: 54 };
    var finalOk = nodes.length > 0 && nodes.every(function (node) {
      return node.status === "completed" || node.status === "reused";
    });
    var finalNode = {
      x: width / 2 - 92,
      y: PAD + NODE_H + GAP_Y + rowCount * (NODE_H + GAP_Y),
      w: 184, h: 54, ok: finalOk,
      failed: nodes.some(function (node) { return node.status === "failed"; })
    };

    var outgoing = new Set();
    var incoming = new Set();
    var edges = [];
    nodes.forEach(function (node) {
      (node.dependencies || []).forEach(function (dep) {
        if (!byId.has(dep)) return;
        outgoing.add(dep);
        incoming.add(node.id);
        edges.push({ from: dep, to: node.id });
      });
    });

    return {
      version: version.version,
      width: width,
      height: height,
      positions: positions,
      rows: rows,
      rowCount: rowCount,
      entry: entry,
      finalNode: finalNode,
      edges: edges,
      roots: nodes.filter(function (node) { return !incoming.has(node.id); }),
      leaves: nodes.filter(function (node) { return !outgoing.has(node.id); })
    };
  }

  function edgePath(x1, y1, x2, y2) {
    var mid = (y1 + y2) / 2;
    return "M" + x1 + "," + y1 + " C" + x1 + "," + mid + " " + x2 + "," + mid + " " + x2 + "," + y2;
  }

  function markerFor(status) {
    return "url(#ah-" + status + ")";
  }

  function renderChart() {
    try {
      renderChartInner();
    } catch (err) {
      console.error("流程图渲染失败", err);
      var fallback = $("chart");
      if (fallback) {
        fallback.setAttribute("viewBox", "0 0 800 240");
        fallback.innerHTML = '<text x="400" y="118" text-anchor="middle" font-size="13" style="fill:var(--color-bad)">' +
          esc(t("chart.renderFailed") + (err && err.message ? err.message : err)) + "</text>";
      }
      toast(t("toast.chartFailed"), true);
    }
  }

  function renderChartInner() {
    var svg = $("chart");
    if (!svg) return;
    var wrap = $("chart-wrap");
    var version = currentPlanVersion();
    if (!version || !version.nodes || !version.nodes.length) {
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 800 240");
      var waiting = (state.detail && state.detail.classification)
        ? t("chart.waitingPlan") : t("chart.waitingClassify");
      svg.innerHTML = '<text x="400" y="118" text-anchor="middle" font-size="13" style="fill:var(--color-muted)">' + esc(waiting) + "</text>" +
        '<text x="400" y="142" text-anchor="middle" font-size="12" style="fill:var(--color-rule-2)">' + esc(t("chart.waitingHint")) + "</text>";
      state.base = null;
      state.view = null;
      wrap.style.height = "240px";
      svg.style.height = "240px";
      return;
    }
    wrap.style.height = "540px";
    svg.style.height = "540px";

    var graph = buildGraph(version);
    state.base = { w: graph.width, h: graph.height };
    if (!state.view || state.view === null) {
      state.view = { x: 0, y: 0, w: graph.width, h: graph.height };
    }
    if (state.view.baseVersion !== version.version) {
      state.view = { x: 0, y: 0, w: graph.width, h: graph.height, baseVersion: version.version };
    }

    var parts = [];
    parts.push('<defs>');
    ["success", "active", "failed", "muted"].forEach(function (name) {
      var color = { success: "var(--color-ok)", active: "var(--color-cool)", failed: "var(--color-bad)", muted: "var(--color-rule-2)" }[name];
      parts.push('<marker id="ah-' + name + '" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" style="fill:' + color + '"></path></marker>');
    });
    parts.push("</defs>");

    // 入口 → 根节点
    graph.roots.forEach(function (node) {
      var pos = graph.positions.get(node.id);
      var status = edgeStatus({ status: "completed" }, node);
      parts.push('<path class="flow-edge ' + status + '" d="' +
        edgePath(graph.entry.x + graph.entry.w / 2, graph.entry.y + graph.entry.h,
          pos.x + pos.w / 2, pos.y) + '" marker-end="' + markerFor(status) + '"></path>');
    });

    // 依赖边
    graph.edges.forEach(function (edge) {
      var from = graph.positions.get(edge.from);
      var to = graph.positions.get(edge.to);
      if (!from || !to) return;
      var status = edgeStatus(from.node, to.node);
      parts.push('<path class="flow-edge ' + status + '" d="' +
        edgePath(from.x + from.w / 2, from.y + from.h, to.x + to.w / 2, to.y) +
        '" marker-end="' + markerFor(status) + '"></path>');
    });

    // 叶节点 → 终结点
    graph.leaves.forEach(function (node) {
      var pos = graph.positions.get(node.id);
      var status = edgeStatus(node, { status: graph.finalNode.ok ? "completed" : "pending" });
      parts.push('<path class="flow-edge ' + status + '" d="' +
        edgePath(pos.x + pos.w / 2, pos.y + pos.h,
          graph.finalNode.x + graph.finalNode.w / 2, graph.finalNode.y) +
        '" marker-end="' + markerFor(status) + '"></path>');
    });

    // 入口
    parts.push('<g class="terminal-node"><rect x="' + graph.entry.x + '" y="' + graph.entry.y +
      '" width="' + graph.entry.w + '" height="' + graph.entry.h + '" rx="10"></rect>' +
      '<text x="' + (graph.entry.x + graph.entry.w / 2) + '" y="' + (graph.entry.y + graph.entry.h / 2 + 4) +
      '" text-anchor="middle">' + esc(t("chart.userTask")) + "</text></g>");

    // 子任务节点
    graph.positions.forEach(function (pos) {
      var node = pos.node;
      var lines = wrapLines(node.title, 15, 2);
      var selected = state.selectedNode === node.id ? " selected" : "";
      var attempt = node.attempt
        ? '<text class="attempt" x="' + (pos.x + pos.w - 12) + '" y="' + (pos.y + 20) + '" text-anchor="end">' +
          node.attempt + "/" + (node.max_attempts || "?") + "</text>" : "";
      var titleSpans = lines.map(function (line, index) {
        return '<tspan x="' + (pos.x + 14) + '" y="' + (pos.y + 30 + index * 18) + '">' + esc(line) + "</tspan>";
      }).join("");
      var role = node.status === "reused" && node.reused_from
        ? t("chart.reusedFrom", { id: node.reused_from }) : (node.role || "");
      parts.push('<g class="flow-node status-' + esc(node.status) + selected + '" data-node-id="' + esc(node.id) + '">' +
        '<rect class="body" x="' + pos.x + '" y="' + pos.y + '" width="' + pos.w + '" height="' + pos.h + '" rx="12"></rect>' +
        '<circle cx="' + (pos.x + 15) + '" cy="' + (pos.y + 15) + '" r="4" style="fill:' + nodeVisual(node.status) + '"></circle>' +
        '<text class="title" x="' + (pos.x + 14) + '" y="' + (pos.y + 30) + '">' + titleSpans + "</text>" +
        '<text class="meta" x="' + (pos.x + 14) + '" y="' + (pos.y + pos.h - 13) + '">' +
        esc(role) + " · " + esc(nodeStatusLabel(node.status)) + "</text>" +
        attempt + "</g>");
    });

    // 终结点
    var finalClass = "terminal-node final" + (graph.finalNode.ok ? " ok" : "") +
      (graph.finalNode.failed ? " failed" : "");
    var finalText = graph.finalNode.ok ? t("chart.finalAnswer") :
      (state.detail.status === "failed" ? t("chart.taskFailed") : t("chart.finalAnswer"));
    parts.push('<g class="' + finalClass + '"><rect x="' + graph.finalNode.x + '" y="' + graph.finalNode.y +
      '" width="' + graph.finalNode.w + '" height="' + graph.finalNode.h + '" rx="10"></rect>' +
      '<text x="' + (graph.finalNode.x + graph.finalNode.w / 2) + '" y="' + (graph.finalNode.y + graph.finalNode.h / 2 + 4) +
      '" text-anchor="middle">' + esc(finalText) + "</text></g>");

    svg.innerHTML = parts.join("");
    applyView();
    bindChartEvents(svg);
  }

  function applyView() {
    var svg = $("chart");
    if (!svg || !state.view) return;
    svg.setAttribute("viewBox", state.view.x + " " + state.view.y + " " + state.view.w + " " + state.view.h);
  }

  function fitView() {
    if (!state.base) return;
    var version = currentPlanVersion();
    state.view = {
      x: 0, y: 0, w: state.base.w, h: state.base.h,
      baseVersion: version ? version.version : undefined
    };
    applyView();
  }

  function zoom(factor, px, py) {
    if (!state.view || !state.base) return;
    var view = state.view;
    var centerX = px == null ? view.x + view.w / 2 : px;
    var centerY = py == null ? view.y + view.h / 2 : py;
    var nextW = Math.min(state.base.w * 3, Math.max(state.base.w * 0.32, view.w * factor));
    var ratio = nextW / view.w;
    view.x = centerX - (centerX - view.x) * ratio;
    view.y = centerY - (centerY - view.y) * ratio;
    view.w = nextW;
    view.h = view.h * ratio;
    applyView();
  }

  function bindChartEvents(svg) {
    if (svg._bound) return;
    svg._bound = true;

    svg.addEventListener("wheel", function (event) {
      if (!state.view) return;
      event.preventDefault();
      var rect = svg.getBoundingClientRect();
      var px = state.view.x + (event.clientX - rect.left) / rect.width * state.view.w;
      var py = state.view.y + (event.clientY - rect.top) / rect.height * state.view.h;
      zoom(event.deltaY > 0 ? 1.12 : 0.89, px, py);
    }, { passive: false });

    var drag = null;
    svg.addEventListener("pointerdown", function (event) {
      if (event.target.closest(".flow-node")) return;
      if (!state.view) return;
      drag = { x: event.clientX, y: event.clientY, vx: state.view.x, vy: state.view.y };
      svg.classList.add("dragging");
      try { svg.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
    });
    svg.addEventListener("pointermove", function (event) {
      if (!drag || !state.view) return;
      var rect = svg.getBoundingClientRect();
      state.view.x = drag.vx - (event.clientX - drag.x) / rect.width * state.view.w;
      state.view.y = drag.vy - (event.clientY - drag.y) / rect.height * state.view.h;
      applyView();
    });
    var endDrag = function () {
      drag = null;
      svg.classList.remove("dragging");
    };
    svg.addEventListener("pointerup", endDrag);
    svg.addEventListener("pointercancel", endDrag);
  }

  function renderNodeDetail() {
    var host = $("node-detail");
    if (!host) return;
    var version = currentPlanVersion();
    var node = null;
    if (version && state.selectedNode) {
      node = (version.nodes || []).find(function (item) { return item.id === state.selectedNode; });
    }
    if (!node) {
      host.innerHTML = "";
      return;
    }
    var rows = [
      [t("node.subtaskId"), node.id],
      [t("node.role"), node.role || "—"],
      [t("node.status"), nodeStatusLabel(node.status)],
      [t("node.attempts"), node.attempt ? node.attempt + " / " + (node.max_attempts || "?") : "—"],
      [t("node.dependencies"), (node.dependencies || []).join(t("common.separator")) || t("common.none")],
      [t("node.allowedTools"), (node.allowed_tools || []).join(t("common.separator")) || t("common.none")],
      [t("node.duration"), node.duration ? fmtDuration(node.duration) : "—"]
    ];
    if (node.reused_from) rows.push([t("node.reusedFrom"), node.reused_from]);
    var html = '<div class="node-detail"><div class="top">' +
      '<span class="status-dot ' + (node.status === "completed" || node.status === "reused" ? "completed" : node.status === "failed" ? "failed" : "running") + '"></span>' +
      "<strong>" + esc(node.title) + "</strong>" +
      '<span class="tag mono">' + esc(node.status) + "</span>" +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn ghost small" id="node-close">' + esc(t("common.collapse")) + "</button></div>" +
      '<div class="kv">' + rows.map(function (row) {
        return '<span class="k">' + esc(row[0]) + '</span><span class="v">' + esc(row[1]) + "</span>";
      }).join("") + "</div>";
    if (node.instructions) {
      html += '<div style="margin-top:10px"><div class="k" style="font-size:12px;color:var(--faint);margin-bottom:4px">' + esc(t("node.instructions")) + '</div>' +
        '<div class="pre-block">' + esc(node.instructions) + "</div></div>";
    }
    if (node.expected_output) {
      html += '<div style="margin-top:10px"><div class="k" style="font-size:12px;color:var(--faint);margin-bottom:4px">' + esc(t("node.expected")) + '</div>' +
        '<div class="pre-block">' + esc(node.expected_output) + "</div></div>";
    }
    if (node.output_preview) {
      html += '<div style="margin-top:10px"><div class="k" style="font-size:12px;color:var(--faint);margin-bottom:4px">' + esc(t("node.actual")) + '</div>' +
        '<div class="pre-block">' + esc(node.output_preview) + "</div></div>";
    }
    if (node.error) {
      html += '<div style="margin-top:10px"><div class="k" style="font-size:12px;color:var(--danger);margin-bottom:4px">' + esc(t("node.error")) + '</div>' +
        '<div class="pre-block bad">' + esc(node.error) + "</div></div>";
    }
    host.innerHTML = html + "</div>";
  }

  /* ------------------------------ 完整执行路线 ------------------------------ */
  function renderRouteSummary(detail) {
    var route = detail.route || {};
    var parts = [];
    if (route.available) {
      parts.push('<span class="tag blue">' + esc(t("route.method")) + esc(route.method_label || "—") + "</span>");
      parts.push('<span class="tag green">' + esc(t("route.branch")) + esc(route.effective_label || "—") + "</span>");
      if (route.original_task_type) {
        parts.push('<span class="tag amber">' + esc(t("route.original")) + esc(route.original_task_type) + "</span>");
      }
      if (route.guard_fallback) parts.push('<span class="tag amber">' + esc(t("route.guard")) + "</span>");
    } else {
      parts.push('<span class="tag">' + esc(t("route.awaiting")) + "</span>");
    }
    var counts = [];
    var callCount = (detail.tool_calls || []).length;
    var agentCount = (detail.dynamic_agents || []).length;
    var toolCount = (detail.generated_tools || []).length;
    if (callCount) counts.push(t("route.toolCalls", { n: callCount }));
    if (agentCount) counts.push(t("route.dynamicAgents", { n: agentCount }));
    if (toolCount) counts.push(t("route.dynamicTools", { n: toolCount }));
    if (counts.length) parts.push('<span class="tag teal">' + esc(counts.join(" · ")) + "</span>");
    if (route.reasoning) parts.push('<span class="route-note">' + esc(route.reasoning) + "</span>");
    return '<div class="route-summary">' + parts.join("") + "</div>";
  }

  function journeyEdgePath(x1, y1, x2, y2) {
    var mid = (y1 + y2) / 2;
    return "M" + x1 + "," + y1 + " C" + x1 + "," + mid + " " + x2 + "," + mid + " " + x2 + "," + y2;
  }

  function journeyNodeSvg(node) {
    var selected = state.journeySelected === node.id ? " selected" : "";
    var lines = wrapLines(node.title, 22, 2);
    var titleSpans = lines.map(function (line, index) {
      return '<tspan x="' + (node.x + 14) + '" y="' + (node.y + 26 + index * 15) + '">' + esc(line) + "</tspan>";
    }).join("");
    var subY = node.y + 26 + lines.length * 15 + 2;
    var parts = [
      '<g class="journey-node kind-' + esc(node.kind) + " status-" + esc(node.status) + selected +
        '" data-journey-id="' + esc(node.id) + '">',
      '<rect class="body" x="' + node.x + '" y="' + node.y + '" width="' + node.w + '" height="' + node.h + '" rx="11"></rect>',
      '<circle cx="' + (node.x + 14) + '" cy="' + (node.y + 14) + '" r="4" style="fill:' +
        (JOURNEY_STATUS_COLOR[node.status] || "var(--color-muted)") + '"></circle>',
      '<text class="j-title" x="' + (node.x + 14) + '" y="' + (node.y + 26) + '">' + titleSpans + "</text>"
    ];
    if (node.subtitle) {
      var subtitle = wrapLines(node.subtitle, 28, 1)[0];
      parts.push('<text class="j-sub" x="' + (node.x + 14) + '" y="' + subY + '">' + esc(subtitle) + "</text>");
    }
    if (node.chips && node.chips.length) {
      var chipText = node.chips.join(" · ");
      parts.push('<text class="j-chip" x="' + (node.x + 14) + '" y="' + (subY + 17) + '">' +
        esc(chipText.length > 34 ? chipText.slice(0, 33) + "…" : chipText) + "</text>");
    }
    parts.push('<text class="j-sub" x="' + (node.x + node.w - 10) + '" y="' + (node.y + node.h - 9) +
      '" text-anchor="end">' + esc(journeyStatusLabel(node.status)) + "</text>");
    parts.push("</g>");
    return parts.join("");
  }

  function renderJourney() {
    var svg = $("journey");
    var wrap = $("journey-wrap");
    if (!svg || !wrap) return;
    var journey = state.detail && state.detail.journey;
    var sub = $("journey-sub");
    if (!journey || !journey.nodes || !journey.nodes.length) {
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 800 220");
      svg.innerHTML = '<text x="400" y="105" text-anchor="middle" font-size="13" style="fill:var(--color-muted)">' +
        esc(t("journey.waiting")) + "</text>" +
        '<text x="400" y="130" text-anchor="middle" font-size="12" style="fill:var(--color-rule-2)">' +
        esc(t("journey.waitingHint")) + "</text>";
      wrap.style.height = "220px";
      svg.style.height = "220px";
      state.journeyBase = null;
      state.journeyView = null;
      state.journeySize = "";
      if (sub) sub.textContent = "";
      return;
    }
    wrap.style.height = "600px";
    svg.style.height = "600px";
    state.journeyBase = { w: journey.width, h: journey.height };
    var size = journey.width + "x" + journey.height;
    if (state.journeySize !== size || !state.journeyView) {
      state.journeySize = size;
      var box = wrap.getBoundingClientRect();
      var unit = journey.width / Math.max(1, box.width || journey.width);
      var viewH = Math.min(journey.height, unit * (box.height || 600));
      state.journeyView = { x: 0, y: 0, w: journey.width, h: viewH };
    }
    if (sub) {
      sub.textContent = t("journey.sub", {
        nodes: journey.nodes.length,
        calls: (state.detail.tool_calls || []).length
      });
    }

    var byId = {};
    journey.nodes.forEach(function (node) { byId[node.id] = node; });
    var parts = ["<defs>"];
    ["success", "active", "failed", "warn", "muted"].forEach(function (name) {
      var color = { success: "var(--color-ok)", active: "var(--color-cool)", failed: "var(--color-bad)", warn: "var(--color-accent)", muted: "var(--color-rule-2)" }[name];
      parts.push('<marker id="jm-' + name + '" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
        '<path d="M0,0 L10,5 L0,10 z" style="fill:' + color + '"></path></marker>');
    });
    parts.push("</defs>");

    (journey.edges || []).forEach(function (edge) {
      var from = byId[edge.from];
      var to = byId[edge.to];
      if (!from || !to) return;
      var status = edge.status || "muted";
      parts.push('<path class="j-edge ' + status + '" d="' +
        journeyEdgePath(from.x + from.w / 2, from.y + from.h, to.x + to.w / 2, to.y) + '"' +
        (edge.dashed && status !== "active" ? ' stroke-dasharray="5 5"' : "") +
        ' marker-end="url(#jm-' + status + ')"></path>');
      if (edge.label) {
        parts.push('<text class="j-edge-label" x="' +
          ((from.x + from.w / 2 + to.x + to.w / 2) / 2 + 6) + '" y="' +
          ((from.y + from.h + to.y) / 2) + '">' + esc(edge.label) + "</text>");
      }
    });
    journey.nodes.forEach(function (node) { parts.push(journeyNodeSvg(node)); });
    svg.innerHTML = parts.join("");
    applyJourneyView();
    bindJourneyEvents(svg);
  }

  function applyJourneyView() {
    var svg = $("journey");
    if (!svg || !state.journeyView) return;
    svg.setAttribute("viewBox", state.journeyView.x + " " + state.journeyView.y + " " +
      state.journeyView.w + " " + state.journeyView.h);
  }

  function fitJourneyView() {
    if (!state.journeyBase) return;
    state.journeyView = { x: 0, y: 0, w: state.journeyBase.w, h: state.journeyBase.h };
    applyJourneyView();
  }

  function zoomJourney(factor, px, py) {
    if (!state.journeyView || !state.journeyBase) return;
    var view = state.journeyView;
    var centerX = px == null ? view.x + view.w / 2 : px;
    var centerY = py == null ? view.y + view.h / 2 : py;
    var nextW = Math.min(state.journeyBase.w * 3, Math.max(state.journeyBase.w * 0.3, view.w * factor));
    var ratio = nextW / view.w;
    view.x = centerX - (centerX - view.x) * ratio;
    view.y = centerY - (centerY - view.y) * ratio;
    view.w = nextW;
    view.h = view.h * ratio;
    applyJourneyView();
  }

  function bindJourneyEvents(svg) {
    if (svg._bound) return;
    svg._bound = true;
    svg.addEventListener("wheel", function (event) {
      if (!state.journeyView) return;
      event.preventDefault();
      var rect = svg.getBoundingClientRect();
      var px = state.journeyView.x + (event.clientX - rect.left) / rect.width * state.journeyView.w;
      var py = state.journeyView.y + (event.clientY - rect.top) / rect.height * state.journeyView.h;
      zoomJourney(event.deltaY > 0 ? 1.12 : 0.89, px, py);
    }, { passive: false });

    var drag = null;
    svg.addEventListener("pointerdown", function (event) {
      if (event.target.closest(".journey-node")) return;
      if (!state.journeyView) return;
      drag = { x: event.clientX, y: event.clientY, vx: state.journeyView.x, vy: state.journeyView.y };
      svg.classList.add("dragging");
      try { svg.setPointerCapture(event.pointerId); } catch (err) { /* ignore */ }
    });
    svg.addEventListener("pointermove", function (event) {
      if (!drag || !state.journeyView) return;
      var rect = svg.getBoundingClientRect();
      state.journeyView.x = drag.vx - (event.clientX - drag.x) / rect.width * state.journeyView.w;
      state.journeyView.y = drag.vy - (event.clientY - drag.y) / rect.height * state.journeyView.h;
      applyJourneyView();
    });
    var endDrag = function () {
      drag = null;
      svg.classList.remove("dragging");
    };
    svg.addEventListener("pointerup", endDrag);
    svg.addEventListener("pointercancel", endDrag);
  }

  function callStatusClass(status) {
    if (status === "failed") return "err";
    if (status === "running") return "warn";
    return "ok";
  }

  function callStatusLabel(status) {
    if (status === "running") return t("call.running");
    if (status === "completed") return t("call.completed");
    if (status === "failed") return t("call.failed");
    return status;
  }

  function toolCallCard(call) {
    var html = '<div class="tool-call"><div class="top">' +
      '<span class="name">' + esc(call.tool) + "</span>" +
      '<span class="pill ' + callStatusClass(call.status) + '">' + esc(callStatusLabel(call.status)) + "</span>" +
      (call.agent ? '<span class="meta">' + esc(call.agent) + "</span>" : "") +
      (call.subtask_id ? '<span class="meta">' + esc(t("journey.subtask", { id: call.subtask_id })) + "</span>" : "") +
      (call.duration ? '<span class="meta">' + esc(call.duration) + "s</span>" : "") +
      (call.call_id ? '<span class="meta">' + esc(call.call_id) + "</span>" : "") +
      "</div>";
    if (call.arguments || call.output) {
      html += '<div class="io">';
      if (call.arguments) {
        html += '<span class="k">' + esc(t("call.arguments")) + '</span><span class="v">' + esc(call.arguments) + "</span>";
      }
      if (call.output) {
        html += '<span class="k">' + esc(t("call.output")) + '</span><span class="v">' + esc(call.output) + "</span>";
      }
      html += "</div>";
    }
    return html + "</div>";
  }

  function agentCallCard(agent) {
    var status = agent.status || "unknown";
    var cls = status === "failed" ? "err" : (status === "completed" || status === "released") ? "ok" : "warn";
    var html = '<div class="agent-call"><div class="top">' +
      '<span class="name">' + esc(agent.agent_id) + "</span>" +

  function generatedToolCard(tool) {
    var cls = tool.status === "registered" ? "ok" : tool.status === "unresolved" ? "err" : "warn";
    var label = tool.status === "registered" ? t("gen.registered") :

      var stepCls = step.action === "registered" ? "ok" : step.action === "gap_unresolved" ? "err" : "";
      return '<span class="gen-step ' + stepCls + '" title="' + esc(step.detail || "") + '">' +
        esc(step.label || step.action) + "</span>";

  function renderJourneyDetail() {
    var host = $("journey-detail");

    if (journey && state.journeySelected) {

      esc(journeyStatusLabel(node.status)) + "</span>" +

      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn ghost small" id="journey-close">' + esc(t("common.collapse")) + "</button></div>";
    if ((node.rows || []).length) {

  /* ------------------------------ Markdown ------------------------------ */
  function renderMarkdown(text) {
    if (!text) return "";
    var blocks = [];
    var source = String(text).replace(/```([\w+-]*)\s*\n?([\s\S]*?)```/g, function (match, lang, code) {
      blocks.push('<pre class="code"><code>' + esc(code) + "</code></pre>");
      return "\u0000BLOCK" + (blocks.length - 1) + "\u0000";
    });
    var html = esc(source);
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
    html = html.replace(/^### (.*)$/gm, "<h4>$1</h4>")
      .replace(/^## (.*)$/gm, "<h3>$1</h3>")
      .replace(/^# (.*)$/gm, "<h2>$1</h2>");
    html = html.replace(/^\s*[-*]\s+(.*)$/gm, "<li>$1</li>");
    html = html.replace(/(<li>[\s\S]*?<\/li>(?:\s*<li>[\s\S]*?<\/li>)*)/g, "<ul>$1</ul>");
    html = html.split(/\n{2,}/).map(function (part) {
      var trimmed = part.trim();
      if (!trimmed) return "";
      if (/^<(h\d|ul|pre)/.test(trimmed)) return trimmed;
      return "<p>" + trimmed.replace(/\n/g, "<br>") + "</p>";
    }).join("");
    html = html.replace(/\u0000BLOCK(\d+)\u0000/g, function (match, index) {
      return blocks[Number(index)] || "";
    });
    return html;
  }

  /* ------------------------------ 交互 ------------------------------ */
  function bindGlobalEvents() {
    $("ask-form").addEventListener("submit", submitTask);
    $("objective").addEventListener("keydown", function (event) {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") submitTask(event);
    });
    $("refresh-btn").addEventListener("click", function () {
      tick();
      toast(t("toast.refreshed"));
    });
    $("lang-btn").addEventListener("click", function () {

    });
    $("ops-btn").addEventListener("click", openOps);
    $("ops-close").addEventListener("click", closeOps);
    $("ops-refresh").addEventListener("click", function () {
      loadOps();
    });
    $("ops-tabs").addEventListener("click", function (event) {
      var tab = event.target.closest("[data-ops-tab]");
      if (!tab) return;
      state.ops.tab = tab.getAttribute("data-ops-tab");
      renderOps();
    });
    $("ops-content").addEventListener("click", async function (event) {
      var reload = event.target.closest("#ops-mcp-reload");
      if (reload) {
        try {
          await api("/api/tools/reload", { method: "POST" });
          toast(t("toast.mcpReloaded"));
          await loadOps();
        } catch (err) {
          toast(err.message || String(err), true);
        }
        return;
      }
      var action = event.target.closest("[data-tool-action]");
      if (action) {
        await opsToolAction(
          action.getAttribute("data-tool-name"),
          action.getAttribute("data-tool-action"),
          action.getAttribute("data-tool-pinned") === "true"
        );
      }
    });
    $("ops-modal").addEventListener("click", function (event) {
      if (event.target === $("ops-modal")) closeOps();
    });

    $("task-list").addEventListener("click", function (event) {
      var item = event.target.closest(".task-item");
      if (item) selectTask(item.getAttribute("data-task-id"), false);
    });
    $("task-list").addEventListener("keydown", function (event) {
      var item = event.target.closest(".task-item");
      if (item && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        selectTask(item.getAttribute("data-task-id"), false);
      }
    });
    $("sched-list").addEventListener("click", function (event) {
      var item = event.target.closest(".task-item");
      if (item) toggleScheduledRuns(item);
    });
    $("sched-list").addEventListener("keydown", function (event) {
      var item = event.target.closest(".task-item");
      if (item && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        toggleScheduledRuns(item);
      }
    });

    var workspace = $("workspace");
    workspace.addEventListener("click", async function (event) {
      var versionTab = event.target.closest("[data-version]");
      if (versionTab) {
        var version = Number(versionTab.getAttribute("data-version"));
        state.version = version;
        state.followCurrent = !state.detail.plan || version === state.detail.plan.current;
        state.view = null;
        renderVersionTabs();
        renderChart();
        return;
      }
      var journeyZoomButton = event.target.closest("[data-jzoom]");
      if (journeyZoomButton) {
        var journeyMode = journeyZoomButton.getAttribute("data-jzoom");
        if (journeyMode === "fit") fitJourneyView();
        else zoomJourney(journeyMode === "in" ? 0.82 : 1.22);
        return;
      }
      var journeyNode = event.target.closest(".journey-node");
      if (journeyNode) {
        var journeyId = journeyNode.getAttribute("data-journey-id");
        state.journeySelected = state.journeySelected === journeyId ? null : journeyId;
        renderJourney();
        renderJourneyDetail();
        return;
      }
      if (event.target.closest("#journey-close")) {
        state.journeySelected = null;
        renderJourney();
        renderJourneyDetail();
        return;
      }
      var zoomButton = event.target.closest("[data-zoom]");
      if (zoomButton) {
        var mode = zoomButton.getAttribute("data-zoom");
        if (mode === "fit") fitView();
        else zoom(mode === "in" ? 0.82 : 1.22);
        return;
      }
      var node = event.target.closest(".flow-node");
      if (node) {
        var id = node.getAttribute("data-node-id");
        state.selectedNode = state.selectedNode === id ? null : id;
        renderChart();
        renderNodeDetail();
        return;
      }
      if (event.target.closest("#node-close")) {
        state.selectedNode = null;
        renderChart();
        renderNodeDetail();
        return;
      }
      var preview = event.target.closest("[data-preview]");
      if (preview) {
        openPreview(preview.getAttribute("data-preview"), preview.getAttribute("data-name"));
        return;
      }
      if (event.target.closest("#cancel-btn")) {
        if (!window.confirm(t("confirm.cancel"))) return;
        try {
          await api("/api/tasks/" + encodeURIComponent(state.selected) + "/cancel", { method: "POST" });
          toast(t("toast.cancelRequested"));
          state.lastPayload = "";
          await refreshDetail(true);
        } catch (err) {
          toast(err.message || String(err), true);
        }
        return;
      }
      var guidanceAction = event.target.closest("[data-guidance-action]");
      if (guidanceAction) {
        state.guidance.action = guidanceAction.getAttribute("data-guidance-action");
        var group = guidanceAction.parentElement;
        if (group) {
          Array.prototype.forEach.call(group.querySelectorAll("button"), function (button) {
            button.classList.toggle("active", button === guidanceAction);
          });
        }
        return;
      }
      if (event.target.closest("#guidance-submit")) {
        await submitGuidance();
        return;
      }
      if (event.target.closest("#copy-result")) {
        var text = (state.detail && state.detail.final_result) || "";
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          toast(t("toast.copied"));
        } catch (err) {
          toast(t("toast.copyFailed"), true);
        }
      }
    });

    $("modal-close").addEventListener("click", closeModal);
    $("modal").addEventListener("click", function (event) {
      if (event.target === $("modal")) closeModal();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeModal();
        closeOps();
      }
    });
  }

  async function openPreview(url, name) {
    var content = $("modal-content");
    $("modal-title").textContent = name || t("common.preview");
    content.innerHTML = '<div class="placeholder-text">' + esc(t("common.loading")) + "</div>";
    $("modal").classList.add("show");
    try {
      if (/\.pdf$/i.test(name || "")) {
        content.innerHTML = '<iframe src="' + esc(url) + '?inline=1" title="' + esc(t("preview.pdfTitle")) + '"></iframe>';
        return;
      }
      var response = await fetch(url + "?inline=1", { credentials: "same-origin" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      var text = await response.text();
      if (text.length > 200000) text = text.slice(0, 200000) + t("preview.truncated");
      content.innerHTML = '<pre class="pre-block plain">' + esc(text) + "</pre>";
    } catch (err) {
      content.innerHTML = '<div class="placeholder-text">' + esc(t("error.preview")) + esc(err.message || String(err)) +
        esc(t("error.previewHint")) + "</div>";
    }
  }

  function closeModal() {
    $("modal").classList.remove("show");
    $("modal-content").innerHTML = "";
  }

  /* ------------------------------ 人工指导 ------------------------------ */
  async function submitGuidance() {
    if (!state.selected) return;
    var action = state.guidance.action;
    var rollback = Array.prototype.slice.call(
      document.querySelectorAll('input[name="guidance-rollback"]:checked')
    ).map(function (input) { return input.value; });
    var instructions = ($("guidance-instructions") || {}).value || "";
    var additional = ($("guidance-additional") || {}).value || "";
    if (action === "abort" && !window.confirm(t("confirm.abort"))) return;
    var button = $("guidance-submit");
    if (button) {
      button.disabled = true;
      button.textContent = t("common.submitting");
    }
    try {
      await api("/api/tasks/" + encodeURIComponent(state.selected) + "/guidance", {
        method: "POST",
        body: JSON.stringify({
          action: action,
          rollback_to: rollback,
          instructions: instructions,
          additional_info: additional
        })
      });
      toast(t("toast.guidanceSubmitted"));
      state.lastPayload = "";
      await refreshDetail(true);
    } catch (err) {
      toast(err.message || String(err), true);
      if (button) {
        button.disabled = false;
        button.textContent = t("guidance.submit");
      }
    }
  }

  /* ------------------------------ 运维面板 ------------------------------ */
  function fmtNumber(value) {
    var number = Number(value || 0);
    return isNaN(number) ? "0" : number.toLocaleString(locale());
  }

  function metricCard(label, value, sub) {
    return '<div class="metric-card"><div class="label">' + esc(label) + "</div>" +
      '<div class="value">' + esc(value) + "</div>" +
      '<div class="sub">' + esc(sub) + "</div></div>";
  }

  function kvRow(key, value) {
    return '<div class="kv-row"><span class="k">' + esc(key) + '</span><span class="v">' + value + "</span></div>";
  }

  function statusPill(status) {
    var cls = status === "completed" || status === "scheduled" ? "ok" : status === "failed" ? "err" : status === "human_required" ? "warn" : "";
    return '<span class="pill ' + cls + '">' + esc(statusLabel(status)) + "</span>";
  }

  function renderOpsMetrics() {
    var data = state.ops.data || {};
    var tasks = data.tasks || {};
    var tokens = data.tokens || {};
    var events = data.events || {};
    var tools = data.tools || {};
    var mcp = data.mcp || {};
    var sandbox = data.sandbox || {};
    var escalation = data.escalation || {};
    var html = '<div class="metric-grid">' + [
      metricCard(t("ops.metric.tasks"), fmtNumber(tasks.total),
        t("ops.metric.tasksSub", {
          active: fmtNumber(tasks.active),
          human: fmtNumber(tasks.human_required)
        })),
      metricCard(t("ops.metric.tokens"), fmtNumber(tokens.total_tokens),
        tCount("ops.metric.tokensSub", Object.keys(tokens.by_agent || {}).length, {
          violations: fmtNumber(tokens.violations),
          agents: Object.keys(tokens.by_agent || {}).length,
          cache: Math.round(Number(tokens.cache_hit_ratio || 0) * 100) + "%"
        })),
      metricCard(t("ops.metric.events"), fmtNumber(events.total),
        t("ops.metric.eventsSub", {
          calls: fmtNumber(events.tool_calls),
          denials: fmtNumber(events.tool_denials)
        })),
      metricCard(t("ops.metric.tools"), fmtNumber(tools.generated_total),
        t("ops.metric.toolsSub", {
          verified: fmtNumber(tools.verified),
          quarantined: fmtNumber(tools.quarantined)
        })),
      metricCard(t("ops.metric.mcp"), fmtNumber(mcp.servers),
        t("ops.metric.mcpSub", {
          enabled: fmtNumber(mcp.enabled),
          errors: fmtNumber(mcp.errors)
        })),
      metricCard(t("ops.metric.sandbox"), sandbox.backend || "—",
        sandbox.isolation === "local-validation-only" ? t("ops.metric.sandboxLocal") : t("ops.metric.sandboxExternal")),
      metricCard(t("ops.metric.uptime"), fmtDuration(data.uptime_seconds),
        t("ops.metric.uptimeSub", { time: fmtDateTime(data.generated_at) })),
      metricCard(t("ops.metric.escalation"),
        escalation.webhook_configured ? t("ops.metric.escalationOn") : t("ops.metric.escalationOff"),
        escalation.webhook_host || t("ops.metric.escalationNone"))
    ].join("") + "</div>";

    var statusKeys = Object.keys(tasks.by_status || {}).sort();
    html += '<div class="ops-subhead"><h3>' + esc(t("ops.taskStatus")) + '</h3><span class="sub">' +
      esc(t("ops.taskStatusSub", { n: fmtNumber(tasks.total) })) + "</span></div>" +
      '<div class="kv-list">' + (statusKeys.length ? statusKeys.map(function (key) {
        return kvRow(statusLabel(key), statusPill(key) + " " + fmtNumber(tasks.by_status[key]));
      }).join("") : '<div class="empty-ops">' + esc(t("ops.eventsEmpty")) + "</div>") + "</div>";

    var eventKeys = Object.keys(events.by_type || {}).sort(function (a, b) {
      return events.by_type[b] - events.by_type[a];
    }).slice(0, 12);
    html += '<div class="ops-subhead"><h3>' + esc(t("ops.events")) + '</h3><span class="sub">' +
      esc(t("ops.eventsSub")) + "</span></div>" +
      '<div class="kv-list">' + (eventKeys.length ? eventKeys.map(function (key) {
        return kvRow(key, fmtNumber(events.by_type[key]));
      }).join("") : '<div class="empty-ops">' + esc(t("ops.eventsEmpty")) + "</div>") + "</div>";

    var backends = (sandbox.available_backends || []).map(function (name) {
      return '<span class="tag mono">' + esc(name) + "</span>";
    }).join(" ");
    html += '<div class="ops-subhead"><h3>' + esc(t("ops.sandbox")) + '</h3></div><div class="kv-list">' +
      kvRow(t("ops.currentBackend"), esc(sandbox.backend || "—")) +
      kvRow(t("ops.availableBackends"), backends || "—") +
      kvRow(t("ops.cloudSandbox"), esc(t("ops.cloudSandboxValue"))) +
      kvRow(t("ops.prometheus"), '<a href="/metrics" target="_blank" rel="noreferrer">/metrics</a>') +
      kvRow(t("ops.jsonMetrics"), '<a href="/api/metrics" target="_blank" rel="noreferrer">/api/metrics</a>') +
      "</div>" +
      '<div class="ops-note">' + esc(t("ops.metricsNote")) + "</div>";
    return html;
  }

  function toolRow(tool) {
    var reviewClass = tool.review_status === "approved" ? "ok" :
      tool.review_status === "rejected" ? "err" : "warn";
    var safetyClass = tool.safety_status === "passed" ? "ok" :
      tool.safety_status === "quarantined" ? "err" : "warn";
    var reviewLabel = tool.review_status === "approved" ? t("ops.review.approved") :
      tool.review_status === "rejected" ? t("ops.review.rejected") : t("ops.review.pending");
    var safetyLabel = tool.safety_status === "passed" ? t("ops.safety.passed") :
      tool.safety_status === "quarantined" ? t("ops.safety.quarantined") : t("ops.safety.unchecked");
    var meta = [];
    meta.push('<span class="pill ' + reviewClass + '">' + esc(reviewLabel) + "</span>");
    meta.push('<span class="pill ' + safetyClass + '">' + esc(safetyLabel) + "</span>");
    if (tool.verified) meta.push('<span class="pill ok">' + esc(t("ops.tool.verified")) + "</span>");
    if (tool.pinned) meta.push('<span class="pill ok">' + esc(t("ops.tool.pinned")) + "</span>");
    if (tool.deprecated_at) meta.push('<span class="pill warn">' + esc(t("ops.tool.deprecated")) + "</span>");
    meta.push("<span>v" + esc(tool.version) + "</span>");
    meta.push("<span>" + esc(t("ops.tool.uses", {
      uses: fmtNumber(tool.use_count),
      failures: fmtNumber(tool.failure_count)
    })) + "</span>");
    meta.push("<span>" + esc(t("ops.tool.lastUsed", {
      time: tool.last_used_at ? fmtDateTime(tool.last_used_at) : "—"
    })) + "</span>");
    if (tool.consecutive_failures) {
      meta.push("<span>" + esc(t("ops.tool.consecutive", { n: fmtNumber(tool.consecutive_failures) })) + "</span>");
    }

    var actions = '<button class="btn ghost small" data-tool-action="pin" data-tool-name="' +
      esc(tool.tool_name) + '" data-tool-pinned="' + (!tool.pinned) + '">' +
      esc(tool.pinned ? t("ops.tool.unpin") : t("ops.tool.pin")) + "</button>";
    if (tool.safety_status === "quarantined" || tool.consecutive_failures > 0) {
      actions += '<button class="btn ghost small" data-tool-action="clear" data-tool-name="' +
        esc(tool.tool_name) + '">' + esc(t("ops.tool.clear")) + "</button>";
    }
    if (!tool.deprecated_at && tool.review_status === "approved") {
      actions += '<button class="btn danger small" data-tool-action="deprecate" data-tool-name="' +
        esc(tool.tool_name) + '">' + esc(t("ops.tool.deprecate")) + "</button>";
    }
    var issues = (tool.safety_issues || []).length
      ? '<div class="desc" style="color:var(--danger)">' +
        esc(tool.safety_issues.join(t("ops.tool.issueJoin"))) + "</div>" : "";
    return '<div class="tool-row"><div class="main"><div class="name">' + esc(tool.tool_name) + "</div>" +
      (tool.description ? '<div class="desc">' + esc(tool.description) + "</div>" : "") + issues +
      '<div class="meta">' + meta.join("") + "</div></div>" +
      '<div class="actions">' + actions + "</div></div>";
  }

  function renderOpsTools() {
    var payload = state.ops.tools;
    if (!payload) return '<div class="empty-ops">' + esc(t("common.noData")) + "</div>";
    if (payload.error) return '<div class="empty-ops">' + esc(t("ops.tools.loadFailed")) + esc(payload.error) + "</div>";
    var summary = payload.summary || {};
    var items = payload.tools || [];
    var html = '<div class="metric-grid">' + [
      metricCard(t("ops.metric.tools"), fmtNumber(summary.generated_total),
        t("ops.metric.toolsSub", {
          verified: fmtNumber(summary.verified),
          quarantined: fmtNumber(summary.quarantined)
        })),
      metricCard(t("ops.tools.pinned"), fmtNumber(summary.pinned), t("ops.tools.pinnedSub")),
      metricCard(t("ops.tools.uses"), fmtNumber(summary.use_count),
        t("ops.tools.usesSub", { n: fmtNumber(summary.failure_count) })),
      metricCard(t("ops.tools.lastUsed"), summary.last_used_at ? fmtDateTime(summary.last_used_at) : "—",
        t("ops.tools.checked", { time: fmtDateTime(summary.checked_at) }))
    ].join("") + "</div>" +
      '<div class="ops-subhead"><h3>' + esc(t("ops.tools.inventory")) +
      '</h3><span class="sub" style="overflow-wrap:anywhere">' +
      esc(payload.registry || "") + "</span></div>";
    if (!items.length) {
      return html + '<div class="empty-ops">' + esc(t("ops.tools.empty")) + "</div>";
    }
    html += items.map(toolRow).join("");
    html += '<div class="ops-note">' + esc(t("ops.tools.note")) + "</div>";
    return html;
  }

  function renderOpsMcp() {
    var payload = state.ops.mcp;
    if (!payload) return '<div class="empty-ops">' + esc(t("common.noData")) + "</div>";
    if (payload.error) return '<div class="empty-ops">' + esc(t("ops.mcp.loadFailed")) + esc(payload.error) + "</div>";
    var entries = payload.entries || [];
    var html = '<div class="ops-subhead"><h3>' + esc(t("ops.mcp.title")) +
      '</h3><span class="sub" style="overflow-wrap:anywhere">' +
      esc(payload.server_dir || "") + '</span><span class="spacer"></span>' +
      '<button class="btn small" id="ops-mcp-reload">' + esc(t("ops.mcp.rescan")) + "</button></div>";
    if (!entries.length) {
      return html + '<div class="empty-ops">' + esc(t("ops.mcp.empty")) + "</div>" +
        '<div class="ops-note">' + esc(payload.note || "") + "</div>";
    }
    html += entries.map(function (entry) {
      var tools = (entry.tools || []).map(function (name) {
        return '<span class="tag mono">' + esc(name) + "</span>";
      }).join(" ");
      return '<div class="svc-row"><div class="main"><div class="name">' + esc(entry.name) + "</div>" +
        '<div class="meta"><span class="pill ' + (entry.enabled ? "ok" : "warn") + '">' +
        esc(entry.enabled ? t("ops.mcp.enabled") : t("ops.mcp.disabled")) + "</span>" +
        esc(tCount("ops.mcp.tools", (entry.tools || []).length, { n: (entry.tools || []).length })) + "</div>" +
        (tools ? '<div class="meta">' + tools + "</div>" : "") +
        '<div class="desc" style="font-family:var(--mono);font-size:12px">' + esc(entry.directory) + "</div>" +
        (entry.error ? '<div class="desc" style="color:var(--danger)">' + esc(entry.error) + "</div>" : "") +
        "</div></div>";
    }).join("");
    html += '<div class="ops-note">' + esc(payload.note || "") + "</div>";
    return html;
  }

  function renderOps() {
    var host = $("ops-content");
    if (!host) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-ops-tab]"), function (tab) {
      tab.classList.toggle("active", tab.getAttribute("data-ops-tab") === state.ops.tab);
    });
    if (state.ops.loading) {
      host.innerHTML = '<div class="ops-loading">' + esc(t("common.loading")) + "</div>";
      return;
    }
    if (state.ops.error) {
      host.innerHTML = '<div class="empty-ops">' + esc(t("ops.loadFailed")) + esc(state.ops.error) + "</div>";
      return;
    }
    if (state.ops.tab === "tools") host.innerHTML = renderOpsTools();
    else if (state.ops.tab === "mcp") host.innerHTML = renderOpsMcp();
    else host.innerHTML = renderOpsMetrics();
  }

  async function loadOps() {
    state.ops.loading = true;
    state.ops.error = "";
    $("ops-content").innerHTML = '<div class="ops-loading">' + esc(t("common.loading")) + "</div>";
    try {
      var results = await Promise.all([
        api("/api/metrics"),
        api("/api/tools/generated").catch(function (err) {
          return { error: err.message || String(err) };
        }),
        api("/api/tools/catalog").catch(function (err) {
          return { error: err.message || String(err) };
        })
      ]);
      state.ops.data = results[0];
      state.ops.tools = results[1];
      state.ops.mcp = results[2];
    } catch (err) {
      state.ops.error = err.message || String(err);
    } finally {
      state.ops.loading = false;
      renderOps();
    }
  }

  function openOps() {
    $("ops-modal").classList.add("show");
    loadOps();
  }

  function closeOps() {
    $("ops-modal").classList.remove("show");
  }

  async function opsToolAction(name, action, pinned) {
    if (!name) return;
    if (action === "deprecate" && !window.confirm(t("confirm.deprecate"))) return;
    var path = "/api/tools/generated/" + encodeURIComponent(name) + "/";
    var options = { method: "POST" };
    if (action === "pin") {
      path += "pin";
      options.body = JSON.stringify({ pinned: pinned });
    } else if (action === "clear") {
      path += "clear-quarantine";
    } else if (action === "deprecate") {
      path += "deprecate";
    } else {
      return;
    }
    try {
      await api(path, options);
      toast(t("toast.toolUpdated", { name: name }));
      await loadOps();
    } catch (err) {
      toast(err.message || String(err), true);
    }
  }

  /* ------------------------------ 语言切换 ------------------------------ */
  function applyStaticI18n() {
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-CN";
    document.title = t("app.title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (node) {
      node.textContent = t(node.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-placeholder]"), function (node) {
      node.setAttribute("placeholder", t(node.getAttribute("data-i18n-placeholder")));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-title]"), function (node) {
      node.setAttribute("title", t(node.getAttribute("data-i18n-title")));
    });
    var langBtn = $("lang-btn");
    if (langBtn) {
      langBtn.textContent = t("lang.button");
      langBtn.setAttribute("title", t("lang.title"));
    }
  }

  function setLang(next) {
    var lang = next === "en" ? "en" : "zh";
    if (lang === state.lang) return;
    state.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* ignore */ }
    state.lastPayload = "";
    state.tasksSignature = "";
    state.scheduledSignature = "";
    state.ops = { tab: state.ops.tab, data: null, tools: null, mcp: null, loading: false, error: "" };
    applyStaticI18n();
    renderTaskList();
    renderScheduledTasks();
    renderWorkspace();
    loadHealth();
    if ($("ops-modal").classList.contains("show")) loadOps();
    if (state.selected) {
      refreshDetail(true).catch(function (err) {
        toast(err.message || String(err), true);
      });
    }
  }

  /* ------------------------------ 启动 ------------------------------ */
  applyStaticI18n();
  bindGlobalEvents();
  loadHealth();
  loadTasks().catch(function () {});
  loadScheduledTasks().catch(function () {});
  setInterval(tick, 1200);
  var fitWidth = window.innerWidth;
  window.addEventListener("resize", function () {
    if (window.innerWidth === fitWidth) return;
    fitWidth = window.innerWidth;
    fitTaskTitles($("task-list"));
    fitTaskTitles($("sched-list"));
  });
})();
</script>
</body>
</html>
