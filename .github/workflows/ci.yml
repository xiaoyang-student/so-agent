name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,web]" -c constraints.txt
      - name: Compile
        run: python -m compileall -q src
      - name: Sandbox doctor
        run: python -m so_agent.sandbox_cli doctor --json
      - name: Test
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
